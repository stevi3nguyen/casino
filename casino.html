function pokerHandForFirestore(hand) {
  const { deck, ...rest } = hand;
  return rest;

// ----------------------------------------------------------------------------
// Dealing a new hand — claims "runner" status via a transaction so two
// players clicking Deal at the same instant can't both start a hand.
// ----------------------------------------------------------------------------
async function pokerStartNextHand() {
  try {
    let table = state.poker.table;
    if (!table) return;
    // Anyone who timed out in the last hand is dropped from the table here.
    const kickedPk = autoKickedSeats(table, true);
    if (kickedPk.size) table = { ...table, seats: table.seats.map((s, i) => kickedPk.has(i) ? null : s) };
    const seatedIdx = pokerOccupiedSeats(table);
    if (seatedIdx.length < 2) return;

    // Read everyone's LIVE casino balance right before dealing — the table
    // doesn't cache chip counts on the seat, so this can never drift out of
    // sync with what they also have available in Blackjack.
    const balances = await Promise.all(seatedIdx.map(i =>
      db.collection('casinoProfiles').doc(table.seats[i].authUID).get()
    ));
    // Anyone seated with zero chips can't be dealt in. Clear them off the table
    // (so they don't block everyone else) and let the next auto-deal try again.
    const brokeUids = seatedIdx.filter((i, k) => balances[k] && balances[k].exists && (balances[k].data().chips ?? 0) <= 0)
      .map(i => table.seats[i].authUID);
    if (brokeUids.length) {
      const pref = db.collection('pokerTables').doc(POKER_TABLE_ID);
      await db.runTransaction(async (tx) => {
        const snap = await tx.get(pref);
        if (!snap.exists) return;
        const cur = snap.data();
        if (cur.hand && cur.hand.street !== 'complete') return;
        tx.update(pref, { seats: cur.seats.map(sd => (sd && brokeUids.includes(sd.authUID)) ? null : sd) });
      });
      return;
    }
    const tableForEngine = { seats: table.seats.map((s, i) => {
      if (!s) return null;
      const idx = seatedIdx.indexOf(i);
      const snap = idx === -1 ? null : balances[idx];
      return { ...s, chips: snap && snap.exists ? (snap.data().chips ?? 0) : 0 };
    }), dealerSeat: table.dealerSeat, handNumber: table.handNumber || 0 };

    const holeCardsOut = {};
    const hand = pokerStartHand(tableForEngine, holeCardsOut);
    if (!hand) return; // fewer than 2 funded players once real balances came back

    const ref = db.collection('pokerTables').doc(POKER_TABLE_ID);
    try {
      await db.runTransaction(async (tx) => {
        const snap = await tx.get(ref);
        const current = snap.exists ? snap.data() : null;
        const alreadyInHand = current && current.hand && current.hand.street !== 'complete';
        if (alreadyInHand) throw new Error('a hand is already in progress');
        tx.set(ref, {
          seats: table.seats, dealerSeat: hand.dealerSeat, handNumber: hand.handNumber,
          hand: pokerHandForFirestore(hand), requestedAction: null,
        }, { merge: true });
      });
    } catch (e) {
      if (e.message !== 'a hand is already in progress') throw e;
      return; // someone else won the race to deal — just become an observer
    }

    myRunningHand = hand;
    myRunningHoleCards = holeCardsOut;
    lastProcessedActionId = null;
    await Promise.all(seatedIdx.map(i =>
      db.collection('pokerTables').doc(POKER_TABLE_ID).collection('private').doc(table.seats[i].authUID)
        .set({ cards: holeCardsOut[i], handNumber: hand.handNumber })
    ));
    state.poker.lastError = null;
  } catch (e) {
    console.error('pokerStartNextHand failed', e);
    state.poker.lastError = e.message || String(e);
    render();
  }
}

// Called on every table-doc update. If THIS client is the one running the
// current hand (it has `myRunningHand` in memory) and a player has posted a
// `requestedAction` that hasn't been processed yet, apply it and push the
// updated public state back to Firestore. This is the one place a dropped
// error used to look like a button "doing nothing": if pokerApplyAction
// rejected the action (or the write-back failed) with no visible trace, the
// clicking player saw no change and no explanation.
function maybeRunHandLogic() {
  const table = state.poker.table;
  if (!table || !myRunningHand || !table.hand) return;
  if (table.hand.handNumber !== myRunningHand.handNumber) { myRunningHand = null; myRunningHoleCards = null; return; }
  if (myRunningHand.street === 'complete') return;

  const req = table.requestedAction;
  if (req && req.actionId !== lastProcessedActionId && req.handNumber === myRunningHand.handNumber) {
    lastProcessedActionId = req.actionId;
    try {
      pokerApplyAction(myRunningHand, req.seat, req.type, req.amount);
      if (req.timedOut) autoMarkTimedOut(myRunningHand, req.authUID);
    } catch (e) {
      console.error('poker action rejected', e.message);
      state.poker.lastError = `That action was rejected: ${e.message}`;
      render();
    }
    if (myRunningHand.street === 'showdown') {
      pokerFinishShowdown(myRunningHand, myRunningHoleCards);
    }
    db.collection('pokerTables').doc(POKER_TABLE_ID).update({
      hand: pokerHandForFirestore(myRunningHand),
      requestedAction: null,
    }).catch(e => {
      console.error('failed to write hand update back to Firestore', e);
      state.poker.lastError = e.message || String(e);
      render();
    });
  }
}

// Each seated player applies their OWN net chip change once a hand's result
// is posted — nobody else can touch their balance (the Firestore rule only
// lets a player write their own casinoProfiles doc), so the runner computing
// payouts never actually moves anyone's chips; every player moves their own.
async function maybeApplyMyPayout() {
  const table = state.poker.table;
  const mySeat = myPokerSeatIndex();
  if (!table || !table.hand || !table.hand.result || mySeat === -1) return;
  const hand = table.hand;
  if (hand.totalContributed[mySeat] == null) return; // I wasn't dealt into this hand
  if (state.poker.lastAppliedHandNumber === hand.handNumber) return;
  state.poker.lastAppliedHandNumber = hand.handNumber;
  const payout = hand.result.payouts[mySeat] || 0;
  const delta = payout - hand.totalContributed[mySeat];
  if (delta !== 0) await applyChipDelta(delta);
}

async function pokerSitDown(seatIndex) {
  try {
    if (!state.employee || !state.user) return;
    const ref = db.collection('pokerTables').doc(POKER_TABLE_ID);
    const bjRef = db.collection('blackjackTables').doc(BJ_TABLE_ID);
    await db.runTransaction(async (tx) => {
      // Read both tables before any writes (Firestore transactions require
      // all reads up front) so we can refuse to seat someone here if
      // they're already sitting at the blackjack table.
      const [snap, bjSnap] = await Promise.all([tx.get(ref), tx.get(bjRef)]);
      const table = snap.exists ? snap.data() : { seats: Array(8).fill(null), dealerSeat: null, handNumber: 0, hand: null, requestedAction: null };
      const bjTable = bjSnap.exists ? bjSnap.data() : null;
      if (table.seats[seatIndex]) return; // already taken
      if (table.seats.some(s => s && s.authUID === state.user.uid)) return; // already seated elsewhere at this table
      if (bjTable && bjTable.seats.some(s => s && s.authUID === state.user.uid)) {
        throw new Error("You're already seated at the Blackjack table — stand up there first.");
      }
      const seats = table.seats.slice();
      seats[seatIndex] = { employeeId: state.employee.id, authUID: state.user.uid, name: state.employee.name, photoURL: state.employee.photoURL || null };
      const hand2 = table.hand && table.hand.timedOutUIDs ? { ...table.hand, timedOutUIDs: table.hand.timedOutUIDs.filter(u => u !== state.user.uid) } : table.hand;
      tx.set(ref, { ...table, seats, hand: hand2 }, { merge: true });
    });
    state.poker.lastError = null;
  } catch (e) {
    console.error('pokerSitDown failed', e);
    state.poker.lastError = e.message || String(e);
    render();
  }
}
async function pokerStandUp() {
  try {
    const table = state.poker.table;
    const mySeat = myPokerSeatIndex();
    if (!table || mySeat === -1) return;
    if (table.hand && table.hand.street !== 'complete') return; // can't leave mid-hand
    const ref = db.collection('pokerTables').doc(POKER_TABLE_ID);
    await db.runTransaction(async (tx) => {
      const snap = await tx.get(ref);
      if (!snap.exists) return;
      const cur = snap.data();
      if (cur.hand && cur.hand.street !== 'complete') return; // never mid-hand
      const seats = cur.seats.map(s => (s && s.authUID === state.user.uid) ? null : s);
      const upd = { seats };
      if (cur.hand && cur.hand.timedOutUIDs) upd['hand.timedOutUIDs'] = cur.hand.timedOutUIDs.filter(u => u !== state.user.uid);
      tx.update(ref, upd);
    });
    state.poker.lastError = null;
  } catch (e) {
    console.error('pokerStandUp failed', e);
    state.poker.lastError = e.message || String(e);
    render();
  }
}
async function pokerSendAction(type, amount, timedOut) {
  try {
    const table = state.poker.table;
    const mySeat = myPokerSeatIndex();
    if (!table || !table.hand || table.hand.currentTurnSeat !== mySeat) return;
    if (type === 'fold') Sound.fold(); else Sound.chip();
    await db.collection('pokerTables').doc(POKER_TABLE_ID).update({
      requestedAction: { authUID: state.user.uid, seat: mySeat, type, amount: amount ?? null, timedOut: !!timedOut, handNumber: table.hand.handNumber, actionId: Math.random().toString(36).slice(2) },
    });
    state.poker.lastError = null;
  } catch (e) {
    console.error('pokerSendAction failed', e);
    state.poker.lastError = e.message || String(e);
    render();
  }
}
async function pokerResetTable() {
  try {
    await db.collection('pokerTables').doc(POKER_TABLE_ID).update({ hand: null, requestedAction: null });
    myRunningHand = null; myRunningHoleCards = null;
    state.poker.lastError = null;
  } catch (e) {
    console.error('pokerResetTable failed', e);
    state.poker.lastError = e.message || String(e);
    render();
  }
}

}
function pokerCardHtmlSmall(card, faceDown, animate, delayIndex, extraCls) {

}

// A point on the oval for a seat (see pokerSeatStyle above) and the dealer
// puck, both placed by the SAME visual rotation so the puck always sits
// just inside whichever seat is actually dealing.
function pokerVisualPosStyle(seatIndex, mySeat, totalSeats, rx, ry) {
  return pokerSeatStyle(pokerVisualIndex(seatIndex, mySeat, totalSeats), totalSeats, rx, ry);
}

// Plays the right sound for whatever just changed since the last render,
// and decides whether cards dealt THIS render should play the deal-in
// animation — both keyed off "have we already handled this hand+street",
// so a timer-driven re-render (every second) doesn't replay either one.
// This has side effects (sound, state.poker.last*) — called once per
// render, inside renderPokerScreen, same spot bjt handlers tolerate it.
function pokerUpdateSoundsAndAnim(table, hand, mySeat) {
  const key = hand ? `${hand.handNumber}:${hand.street}` : null;
  let animate = false;

  if (hand && key !== state.poker.lastAnimatedHandStreet) {
    animate = true;
    state.poker.lastAnimatedHandStreet = key;
  }

  if (hand && key !== state.poker.lastSoundHandStreet) {
    if (state.poker.lastSoundHandStreet !== null) {
      const flicks = { preflop: 2, flop: 3, turn: 1, river: 1 }[hand.street] || 1;
      for (let i = 0; i < flicks; i++) Sound.cardFlick(i * 0.08);
    }
    state.poker.lastSoundHandStreet = key;
  }

  const isMyTurnNow = !!(hand && mySeat !== -1 && hand.currentTurnSeat === mySeat);
  if (isMyTurnNow && !state.poker.lastSoundWasMyTurn) Sound.myTurn();
  state.poker.lastSoundWasMyTurn = isMyTurnNow;
  if (isMyTurnNow && hand.turnStartedAt) {
    const secondsLeft = Math.ceil(Math.max(0, POKER_TURN_LIMIT_MS - (Date.now() - hand.turnStartedAt)) / 1000);
    if (secondsLeft <= 5 && secondsLeft >= 1 && state.poker.lastTickSecond !== secondsLeft) {
      Sound.tick();
      state.poker.lastTickSecond = secondsLeft;
    }
  } else {
    state.poker.lastTickSecond = null;
  }

  if (hand && hand.street === 'complete' && hand.result && state.poker.lastSoundResultHandNumber !== hand.handNumber) {
    Sound.win();
    state.poker.lastSoundResultHandNumber = hand.handNumber;
  }

  return animate;
}

// Seat geometry for the stadium table: a squircle (superellipse) ring so
// seats hug the rails evenly, with a gap at the top where the dealer stands.
// "You" (visualIndex 0) sits at the bottom. Returns {x, y} in percent of the
// .pk-wrap box. Pure geometry — doesn't touch game state.
function pkSeatPoint(visualIndex, totalSeats) {
  let u = (visualIndex + 0.5) / totalSeats;
  if (u >= 0.5) u -= 1;
  const theta = u * 2 * Math.PI;
  const sn = Math.sin(theta), cs = Math.cos(theta);
  const x = 50 + 41 * Math.sign(sn) * Math.pow(Math.abs(sn), 0.75);
  const y = 57 + 36 * Math.sign(cs) * Math.pow(Math.abs(cs), 0.75);
  return { x, y };
}
// A point `f` of the way from a seat toward the middle of the table.
function pkInward(pt, f) {
  return { x: pt.x + (50 - pt.x) * f, y: pt.y + (57 - pt.y) * f };
}
function pkPosStyle(pt) { return `left:${pt.x.toFixed(2)}%;top:${pt.y.toFixed(2)}%;`; }

// Queue-ahead buttons (Fold / Check-Fold / Check / Call Any). The choice is
// remembered for the current hand + street only, then runs by itself the
// moment it becomes my turn — the same way real poker apps behave.
function pokerRunPreAction(hand, mySeat) {
  const pa = state.poker.preAction;
  if (!pa) return;
  if (!hand || mySeat === -1 || hand.street === 'complete' || hand.handNumber !== pa.handNumber ||
      hand.street !== pa.street || hand.folded[mySeat]) { state.poker.preAction = null; return; }
  if (hand.currentTurnSeat !== mySeat) return;
  const legal = pokerLegalActions(hand, mySeat);
  if (!legal) return;
  let act = null;
  if (pa.type === 'fold') act = 'fold';
  else if (pa.type === 'checkfold') act = legal.canCheck ? 'check' : 'fold';
  else if (pa.type === 'check') act = legal.canCheck ? 'check' : null;
  else if (pa.type === 'callany') act = legal.canCheck ? 'check' : 'call';
  state.poker.preAction = null;
  if (!act) return;
  const key = `${hand.handNumber}:${hand.street}:${hand.turnStartedAt || 0}`;
  if (state.poker.preFiredKey === key) return;
  state.poker.preFiredKey = key;
  setTimeout(() => { pokerSendAction(act); }, 350);
}


// Showdown presentation: which five cards made each winner's hand (computed
// here from the revealed hole cards + board, so the stored result is untouched),
// plus the ribbon text ("TWO PAIR  10 9").
function pkCardKey(c) { return c.rank + c.suit; }
function pkShowdownInfo(hand) {
  if (!hand || hand.street !== 'complete' || !hand.result || hand.result.wonByFold) return null;
  const winners = Object.entries(hand.result.payouts).filter(([, a]) => a > 0).map(([sd]) => parseInt(sd, 10));
  const keys = new Set();
  let first = null;
  for (const w of winners) {
    const hole = hand.result.revealedHoleCards && hand.result.revealedHoleCards[w];
    if (!hole) continue;
    const best = pokerBestHand(hole.concat(hand.community));
    best.cards.forEach(c => keys.add(pkCardKey(c)));
    if (first === null) first = { seat: w, value: best.value };
  }
  if (!first) return null;
  const face = (n) => ({ 14: 'A', 13: 'K', 12: 'Q', 11: 'J' }[n] || String(n));
  const v = first.value, t = v[0];
  let ranks = [];
  if (t === 1 || t === 3 || t === 7 || t === 4 || t === 8 || t === 5) ranks = [v[1]];
  else if (t === 2 || t === 6) ranks = [v[1], v[2]];
  const name = (hand.result.bestHandBySeat[first.seat] && hand.result.bestHandBySeat[first.seat].name) || POKER_HAND_NAMES[t];
  return { keys, name, ranks: ranks.map(face) };
}

}

function pkWinnerPill(table, hand) {
  const winners = Object.entries(hand.result.payouts).filter(([, a]) => a > 0).map(([sd]) => parseInt(sd, 10));
  if (!winners.length) return '';
  const total = winners.reduce((t, sd) => t + hand.result.payouts[sd], 0);
  const names = winners.map(sd => table.seats[sd] ? escapeHtml(table.seats[sd].name) : '?').join(' & ');
  return `<div class="pk-winner"><span>${names}${winners.length > 1 ? ' split' : ' wins'}</span><strong>+${total}</strong>${hand.result.wonByFold ? '<em>everyone folded</em>' : ''}</div>`;
}

function renderPokerBetPill(hand, seatIndex, mySeat, totalSeats) {
  if (!hand || hand.street === 'complete') return '';
  if (!hand.seatsInHand || !hand.seatsInHand.includes(seatIndex)) return '';
  const bet = hand.bets[seatIndex] || 0;
  if (bet <= 0) return '';
  const pt = pkSeatPoint(pokerVisualIndex(seatIndex, mySeat, totalSeats), totalSeats);
  return `<div class="pk-bet" style="${pkPosStyle(pkInward(pt, 0.5))}"><i></i>${bet}</div>`;
}

function renderPokerWinBanner(table, hand) {
  const winners = Object.entries(hand.result.payouts).filter(([, amt]) => amt > 0).map(([seat]) => parseInt(seat, 10));
  if (winners.length === 0) return '';
  const first = winners[0];
  const cards = hand.result.revealedHoleCards && hand.result.revealedHoleCards[first];
  const handName = hand.result.wonByFold ? 'Everyone else folded' :
    (hand.result.bestHandBySeat[first] ? hand.result.bestHandBySeat[first].name : '');
  const totalWon = winners.reduce((sum, s) => sum + (hand.result.payouts[s] || 0), 0);
  const namesLabel = winners.map(s => table.seats[s] ? escapeHtml(table.seats[s].name) : '?').join(' & ');
  return `
    <div class="poker-win-banner">
      ${cards ? `<div class="poker-win-cards">${cards.map(c => pokerCardHtml(c, false)).join('')}</div>` : ''}
      <div class="poker-win-word">WIN</div>
      <div class="poker-win-amount">+${totalWon} chips</div>
      <div class="poker-win-name">${namesLabel}${winners.length > 1 ? ' split the pot' : ''}${handName ? ` — ${escapeHtml(handName)}` : ''}</div>
    </div>
  `;
}

function renderPokerSeatPos(table, hand, seatIndex, mySeat, totalSeats, animate) {
  const seat = table.seats[seatIndex];
  const visualIndex = pokerVisualIndex(seatIndex, mySeat, totalSeats);
  const seatPt = pkSeatPoint(visualIndex, totalSeats);
  const posStyle = pkPosStyle(seatPt);

  if (!seat) {
    // Only offer empty seats while I'm not seated anywhere at this table.
    return `
      <div class="pk-seat" style="${posStyle}">
        <div class="pk-empty"${mySeat === -1 ? ` data-sit-seat="${seatIndex}"` : ' style="cursor:default;opacity:0.45;"'}>${mySeat === -1 ? 'Sit<br>Here' : ''}</div>
      </div>
    `;
  }

  const inHand = hand && hand.seatsInHand && hand.seatsInHand.includes(seatIndex);
  const isMyTurn = hand && hand.currentTurnSeat === seatIndex;
  const folded = inHand && hand.folded[seatIndex];
  const allIn = inHand && hand.allIn[seatIndex];
  const isMe = seatIndex === mySeat;

  let holeCardsHtml = '';
  if (inHand) {
    if (isMe && state.poker.myHoleCards && state.poker.myHoleCards.handNumber === hand.handNumber) {
      const sdMine = pkShowdownInfo(hand);
      holeCardsHtml = state.poker.myHoleCards.cards.map((c, i) => pokerCardHtmlSmall(c, false, animate, visualIndex * 2 + i, sdMine ? (sdMine.keys.has(pkCardKey(c)) ? 'pk-win-card' : 'pk-dim') : '')).join('');
    } else if (hand.result && hand.result.revealedHoleCards && hand.result.revealedHoleCards[seatIndex]) {
      const sd = pkShowdownInfo(hand);
      holeCardsHtml = hand.result.revealedHoleCards[seatIndex].map(c => pokerCardHtmlSmall(c, false, false, 0, sd ? (sd.keys.has(pkCardKey(c)) ? 'pk-win-card' : 'pk-dim') : '')).join('');
    } else if (!folded) {
      holeCardsHtml = pokerCardHtmlSmall(null, true, animate, visualIndex * 2) + pokerCardHtmlSmall(null, true, animate, visualIndex * 2 + 1);
    }
  }

  let timerHtml = '';
  if (isMyTurn && hand.turnStartedAt && hand.street !== 'complete') {
    const remain = Math.max(0, POKER_TURN_LIMIT_MS - (Date.now() - hand.turnStartedAt));
    const pct = remain / POKER_TURN_LIMIT_MS;
    const seconds = Math.ceil(remain / 1000);
    timerHtml = `<div class="poker-timer-ring" style="--pct:${pct.toFixed(3)}"></div><div class="poker-timer-badge">${seconds}</div>`;
  }

  const stack = inHand && hand.stacks && hand.stacks[seatIndex] != null ? hand.stacks[seatIndex] : seat.chips;
  const statusTag = folded ? 'Fold' : allIn ? 'All-in' : '';

  return `
    <div class="pk-seat${isMyTurn ? ' my-turn' : ''}${folded ? ' folded' : ''}${isMe ? ' is-me' : ''}${seatPt.y < 40 ? ' cards-below' : ''}" style="${posStyle}">
      ${holeCardsHtml ? `<div class="pk-cards">${holeCardsHtml}</div>` : ''}
      <div class="pk-avatar-wrap">
        ${timerHtml}
        ${avatarHtml(seat.name, seat.photoURL, 52)}
        ${statusTag ? `<span class="pk-status"${statusTag === 'All-in' ? ' style="background:var(--gold);color:var(--ink);"' : ''}>${statusTag}</span>` : ''}
      </div>
      <div class="pk-plate">
        <div class="pk-name">${escapeHtml(seat.name)}${isMe ? ' (you)' : ''}</div>
        <div class="pk-stack">${stack ?? 0}</div>
      </div>
    </div>
  `;
}

function renderPokerActionControls(hand, mySeat) {
  const legal = pokerLegalActions(hand, mySeat);
  if (!legal) return '';
  if (state.poker.raiseAmount == null) state.poker.raiseAmount = legal.minRaiseTo;
  state.poker.raiseAmount = Math.max(legal.minRaiseTo, Math.min(legal.maxRaiseTo, state.poker.raiseAmount));
  return `
    <div class="card" style="padding:14px;margin-top:4px;">
      ${legal.canBetOrRaise ? `
        <div class="pk-presets">
          <button data-pk-preset="0.5">½ Pot</button>
          <button data-pk-preset="0.75">¾ Pot</button>
          <button data-pk-preset="1">Pot</button>
          <button data-pk-preset="max">All-In</button>
        </div>
        <input type="range" id="poker-raise-slider" min="${legal.minRaiseTo}" max="${legal.maxRaiseTo}" value="${state.poker.raiseAmount}" style="width:100%;margin:0 0 8px;accent-color:var(--gold);">
      ` : ''}
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:${legal.canBetOrRaise ? '10px' : '0'};">
        <button class="btn btn-danger" id="poker-fold">Fold</button>
        ${legal.canCheck ? `<button class="btn btn-secondary" id="poker-check">Check</button>` : `<button class="btn btn-secondary" id="poker-call">Call ${legal.callAmount}</button>`}
        ${legal.canBetOrRaise ? `<button class="btn btn-primary" id="poker-allin">All-In (${legal.maxRaiseTo})</button>` : ''}
      </div>
      ${legal.canBetOrRaise ? `
        <div style="display:flex;gap:8px;align-items:center;">
          <input class="input" type="number" id="poker-raise-amount" min="${legal.minRaiseTo}" max="${legal.maxRaiseTo}" value="${state.poker.raiseAmount}" style="flex:1;">
          <button class="btn btn-primary" id="poker-raise">${hand.currentBet === 0 ? 'Bet' : 'Raise to'}</button>
        </div>
      ` : ''}
    </div>
  `;
}

function attachPokerHandlers() {
  document.getElementById('poker-dismiss-error')?.addEventListener('click', () => {
    state.poker.lastError = null;
    render();
  });
  document.getElementById('poker-sound-toggle')?.addEventListener('click', () => {
    Sound.setEnabled(!Sound.enabled);
    render();
  });
  document.getElementById('poker-done')?.addEventListener('click', () => {
    leavePokerScreen();
    state.screen = 'home';
    render();
  });
  document.querySelectorAll('[data-sit-seat]').forEach(el => el.addEventListener('click', () => {
    pokerSitDown(parseInt(el.dataset.sitSeat, 10));
  }));
  document.getElementById('poker-get-chips')?.addEventListener('click', resetChips);
  document.getElementById('poker-stand-up')?.addEventListener('click', () => { pokerStandUp(); });
  document.getElementById('poker-reset')?.addEventListener('click', () => { pokerResetTable(); });
  document.getElementById('poker-fold')?.addEventListener('click', () => pokerSendAction('fold'));
  document.getElementById('poker-check')?.addEventListener('click', () => pokerSendAction('check'));
  document.getElementById('poker-call')?.addEventListener('click', () => pokerSendAction('call'));
  document.getElementById('poker-allin')?.addEventListener('click', () => {
    const table = state.poker.table;
    const mySeat = myPokerSeatIndex();
    const legal = pokerLegalActions(table.hand, mySeat);
    pokerSendAction('raise', legal.maxRaiseTo);
  });
  document.getElementById('poker-raise-amount')?.addEventListener('input', (e) => {
    state.poker.raiseAmount = parseInt(e.target.value, 10) || 0;
  });
  document.getElementById('poker-raise')?.addEventListener('click', () => {
    pokerSendAction('raise', state.poker.raiseAmount);
  });
  document.getElementById('poker-raise-slider')?.addEventListener('input', (e) => {
    state.poker.raiseAmount = parseInt(e.target.value, 10) || 0;
    const box = document.getElementById('poker-raise-amount');
    if (box) box.value = state.poker.raiseAmount;
  });
  document.querySelectorAll('[data-pk-preset]').forEach(el => el.addEventListener('click', () => {
    const table = state.poker.table;
    const mySeat = myPokerSeatIndex();
    if (!table || !table.hand || mySeat === -1) return;
    const hand = table.hand;
    const legal = pokerLegalActions(hand, mySeat);
    if (!legal) return;
    const pot = Object.values(hand.totalContributed).reduce((a, b) => a + b, 0);
    const toCall = hand.currentBet - hand.bets[mySeat];
    const v = el.dataset.pkPreset;
    let target = v === 'max' ? legal.maxRaiseTo
      : hand.bets[mySeat] + toCall + Math.round(parseFloat(v) * (pot + toCall));
    state.poker.raiseAmount = Math.max(legal.minRaiseTo, Math.min(legal.maxRaiseTo, target));
    render();
  }));
  document.querySelectorAll('[data-pk-pre]').forEach(el => el.addEventListener('click', () => {
    const table = state.poker.table;
    if (!table || !table.hand) return;
    const type = el.dataset.pkPre;
    const cur = state.poker.preAction;
    state.poker.preAction = (cur && cur.type === type)
      ? null
      : { type, handNumber: table.hand.handNumber, street: table.hand.street };
    render();
  }));
}
</script>
