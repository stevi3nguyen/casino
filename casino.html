}

function rlBoardHtml(t, myChips, open) {
  const opts = { winKeys: null };
  if (t.phase === 'result' && t.result) {
    opts.winKeys = new Set();
    const all = ['red', 'black', 'odd', 'even', 'low', 'high', 'd1', 'd2', 'd3', 'c1', 'c2', 'c3'];
    all.forEach(k => { if (rlBetWins(k, t.result.number)) opts.winKeys.add(k); });
    opts.winKeys.add('n' + t.result.number);
  }
  const gap = '<i class="rl-gap"></i>';
  let h = rlCell('n0', '0', 'green rl-zero', 12, myChips, opts) + gap;
  const rows = [['c3', 3], ['c2', 2], ['c1', 1]]; // top row = 3,6,9..; bottom row = 1,4,7..
  rows.forEach(([ck, off]) => {
    for (let j = 0; j < 12; j++) {
      const n = j * 3 + off;
      h += rlCell('n' + n, String(n), rlColor(n), 1, myChips, opts);
    }
    h += rlCell(ck, '2:1', 'out rl-col', 1, myChips, opts);
  });
  h += rlCell('d1', '1st 12', 'out', 4, myChips, opts) + rlCell('d2', '2nd 12', 'out', 4, myChips, opts) + rlCell('d3', '3rd 12', 'out', 4, myChips, opts) + gap;
  h += rlCell('low', '1-18', 'out', 2, myChips, opts) + rlCell('even', 'EVEN', 'out', 2, myChips, opts)
    + rlCell('red', 'RED', 'red rl-colorbtn', 2, myChips, opts) + rlCell('black', 'BLACK', 'black rl-colorbtn', 2, myChips, opts)
    + rlCell('odd', 'ODD', 'out', 2, myChips, opts) + rlCell('high', '19-36', 'out', 2, myChips, opts) + gap;
  return `<div class="rl-board${open ? '' : ' rl-closed'}" id="rl-board">${h}</div>`;
}

function rlPlayersHtml(t) {
  const uid = rlUid();
  const num = t.phase === 'result' && t.result ? t.result.number : null;
  const rows = Object.keys(t.bets || {}).map(id => {
    const e = t.bets[id] || {};
    const total = rlSumChips(e.chips);
    return { id, name: e.name || 'Player', photoURL: e.photoURL, total, net: num == null ? null : rlSettleAmount(e, num).net };
  }).filter(r => r.total > 0)
    .sort((a, b) => (a.id === uid ? -1 : b.id === uid ? 1 : b.total - a.total));
  const body = rows.length ? rows.map(r => `
      <div class="rl-player${r.id === uid ? ' me' : ''}">
        ${avatarHtml(r.name, r.photoURL, 30)}
        <div class="rl-pname">${escapeHtml(r.name)}${r.id === uid ? ' <small>(you)</small>' : ''}</div>
        <div class="rl-pstake"><span class="chip-icon rl-mini"></span>${r.total}</div>
        ${r.net == null ? '' : `<div class="rl-net ${r.net > 0 ? 'win' : r.net < 0 ? 'lose' : ''}">${r.net > 0 ? '+' : r.net < 0 ? '−' : ''}${Math.abs(r.net)}</div>`}
      </div>`).join('')
    : `<div class="rl-empty">No bets on the table yet.</div>`;
  return `<div class="rl-panel"><div class="rl-panel-title">At the table</div>${body}</div>`;
}

function renderRouletteScreen() {
  const rl = rlEnsureState();
  const t = rl.table;
  if (!t) {
    return `${rlTopbar()}<div class="content rl-content"><div style="padding:40px;text-align:center;color:var(--text-tertiary);">Loading table…</div></div>`;
  }
  const now = Date.now();
  const uid = rlUid();
  const open = rlBettingOpen(t, now);
  rl.lastRenderKey = t.round + '|' + t.phase + '|' + (open ? 1 : 0);
  const mine = (t.bets && t.bets[uid] && t.bets[uid].chips) || {};
  const myTotal = rlSumChips(mine);
  const info = rlStatusInfo(t, now);
  const canRepeat = open && !!(rl.lastBets || (t.prev && t.prev.bets && t.prev.bets[uid]));
  const canUndo = open && rl.undo.some(u => u.round === t.round);

  const hist = t.history.length
    ? t.history.map((n, i) => `<span class="rl-hn ${rlColor(n)}${i === t.history.length - 1 ? ' last' : ''}">${n}</span>`).join('')
    : `<span class="rl-hempty">No spins yet</span>`;

  let resultHtml = '';
  if (t.phase === 'result' && t.result) {
    const n = t.result.number;
    const my = rlSettleAmount({ chips: mine }, n);
    const mineLine = my.stake > 0
      ? `<div class="rl-mine ${my.net > 0 ? 'win' : my.net < 0 ? 'lose' : ''}">${my.net > 0 ? `You won +${my.net}` : my.net < 0 ? `You lost ${-my.net}` : 'You broke even'}</div>`
      : '';
    resultHtml = `
      <div class="rl-result">
        <div class="rl-result-num ${t.result.color}">${n}</div>
        <div class="rl-result-side"><div class="rl-result-word">${t.result.color.toUpperCase()}</div><div class="rl-result-desc">${rlDescribe(n)}</div>${mineLine}</div>
      </div>`;
  }

  return `
    ${rlTopbar()}
    <div class="content rl-content">
      ${rl.lastError ? `
        <div class="rl-error">
          <span>${escapeHtml(rl.lastError)}</span>
          <button class="btn btn-ghost btn-sm" id="rl-dismiss-error" data-rl-act="dismiss" style="flex-shrink:0;">Dismiss</button>
        </div>` : ''}

      <div class="rl-stage">
        <div class="pk-room">${typeof PK_SKYLINE_SVG === 'string' ? PK_SKYLINE_SVG : ''}</div>
        ${rlWheelHtml(t, now)}
      </div>

      <div class="rl-status">
        <div class="rl-status-text" id="rl-status">${escapeHtml(info.text)}</div>
        <div class="rl-timer"><div class="rl-timer-fill" id="rl-timer-fill" style="width:${(info.pct * 100).toFixed(1)}%"></div></div>
      </div>
      <div class="rl-history" aria-label="Recent numbers">${hist}</div>
      ${resultHtml}

      ${rlBoardHtml(t, mine, open)}

      <div class="rl-chipbar">
        ${RL_CHIP_VALUES.map(v => `<button class="rl-chipbtn ${rlChipClass(v)}${rl.chip === v ? ' sel' : ''}" data-rl-act="chip" data-rl-key="${v}" aria-label="Select ${v} chip" aria-pressed="${rl.chip === v}">${v}</button>`).join('')}
      </div>
      <div class="rl-mybets">Your bets this round: <b id="rl-mytotal">${myTotal}</b></div>
      <div class="rl-actions">
        <button class="btn btn-secondary btn-sm" id="rl-undo" data-rl-act="undo" ${canUndo ? '' : 'disabled'}>Undo</button>
        <button class="btn btn-danger btn-sm" id="rl-clear" data-rl-act="clear" ${open && myTotal > 0 ? '' : 'disabled'}>Clear bets</button>
        <button class="btn btn-secondary btn-sm" id="rl-repeat" data-rl-act="repeat" ${canRepeat ? '' : 'disabled'}>Repeat last</button>
      </div>
      ${(state.chips ?? 0) === 0 && myTotal === 0 && typeof resetChips === 'function' ? `<button class="btn btn-primary btn-block" id="rl-get-chips" data-rl-act="getchips" style="margin-top:12px;">Get More Chips</button>` : ''}

      ${rlPlayersHtml(t)}
    </div>`;
}

// ---------------------------------------------------------------------------
// HANDLERS — delegated on #root with pointerdown/up so a re-render between
// press and release (snapshots arrive constantly) can't swallow a tap.
// ---------------------------------------------------------------------------
function rlDispatch(act, key) {
  const rl = rlEnsureState();
  try {
    switch (act) {
      case 'bet': rlPlaceBet(key, rl.chip); break;
      case 'chip': { const v = parseInt(key, 10); if (RL_CHIP_VALUES.indexOf(v) >= 0) { rl.chip = v; render(); } break; }
      case 'undo': rlUndoLast(); break;
      case 'clear': rlClearBets(); break;
      case 'repeat': rlRepeatBets(); break;
      case 'dismiss': rl.lastError = null; render(); break;
      case 'sound': Sound.setEnabled(!Sound.enabled); render(); break;
      case 'getchips': resetChips(); break;
      case 'done': leaveRouletteScreen(); state.screen = 'home'; render(); break;
    }
  } catch (e) {
    console.error('roulette handler failed', e);
    rl.lastError = rlErrMsg(e);
    try { render(); } catch (e2) { console.error(e2); }
  }
}

function rlBindRoot() {
  const root = document.getElementById('root');
  if (!root || root._rlb) return;
  const find = e => {
    const el = e.target && e.target.closest ? e.target.closest('[data-rl-act]') : null;
    return el && root.contains(el) ? el : null;
  };
  const idOf = el => el.dataset.rlAct + ':' + (el.dataset.rlKey || '');
  const onDown = e => {
    if (e.button > 0) return;
    const el = find(e);
    state.rl.down = el && !el.disabled ? { id: idOf(el), x: e.clientX, y: e.clientY } : null;
  };
  const onUp = e => {
    const d = state.rl && state.rl.down;
    if (state.rl) state.rl.down = null;
    if (!d) return;
    const el = find(e);
    if (!el || el.disabled || idOf(el) !== d.id) return;
    if (Math.hypot(e.clientX - d.x, e.clientY - d.y) > 14) return;
    rlDispatch(el.dataset.rlAct, el.dataset.rlKey);
  };
  const onCancel = () => { if (state.rl) state.rl.down = null; };
  const onClick = e => { // keyboard / assistive activation only (detail 0)
    if (e.detail !== 0) return;
    const el = find(e);
    if (el && !el.disabled) rlDispatch(el.dataset.rlAct, el.dataset.rlKey);
  };
  root.addEventListener('pointerdown', onDown);
  root.addEventListener('pointerup', onUp);
  root.addEventListener('pointercancel', onCancel);
  root.addEventListener('click', onClick);
  root._rlb = { onDown, onUp, onCancel, onClick };
}
function rlUnbindRoot() {
  const root = document.getElementById('root');
  if (!root || !root._rlb) return;
  const b = root._rlb;
  root.removeEventListener('pointerdown', b.onDown);
  root.removeEventListener('pointerup', b.onUp);
  root.removeEventListener('pointercancel', b.onCancel);
  root.removeEventListener('click', b.onClick);
  root._rlb = null;
}
function attachRouletteHandlers() {
  rlEnsureState();
  rlBindRoot();
}

if (typeof module !== 'undefined' && module.exports) {
  module.exports = {
    rlColor, rlBetMult, rlValidKey, rlBetWins, rlBetReturn, rlSettleAmount, rlNextPhase, rlNormalize,
    rlDefaultDoc, rlRandInt, rlSumChips, rlBettingOpen, rlSettleSource, rlWheelPlan, rlRestAngle,
    rlStatusInfo, rlDescribe, rlFmt, RL_WHEEL_ORDER, RL_REDS, RL_BETTING_MS, RL_SPIN_MS, RL_RESULT_MS,
  };
}

</script>
<script>
// ===== Craps =====
// ============================================================================
// CRAPS — one shared live table (`crapsTables/main`). Plain classic-script
// fragment: runs AFTER the main script and uses its globals (db, state, auth,
// escapeHtml, avatarHtml, applyChipDelta, resetChips, render, Sound,
// PK_SKYLINE_SVG). Everything here is prefixed cr / CR_ / .cr-.
//
// Dice have no hidden information, so there is no "runner": ANY client moves
// the table forward with a Firestore transaction that re-checks the deadline
// (crAdvance), so only one succeeds. Each player settles THEIR OWN bets and
// credits THEIR OWN chips (crSettleMine) through a transaction that also
// stamps bets[uid].settledRoll, which makes settlement idempotent.
// ============================================================================

const CR_DOC_ID = 'main';
const CR_BETTING_MS = 14000;
const CR_ROLLING_MS = 3000;
const CR_RESULT_MS = 6000;
const CR_ANIM_MS = 2800;            // dice tumble length (fits inside the 3s rolling phase)
const CR_POINTS = [4, 5, 6, 8, 9, 10];
const CR_BET_KEYS = ['pass', 'dontPass', 'field', 'any7', 'anyCraps', 'eleven'];
const CR_ONE_ROLL = ['field', 'any7', 'anyCraps', 'eleven'];
const CR_LABELS = { pass: 'Pass Line', dontPass: "Don't Pass", field: 'Field', any7: 'Any Seven', anyCraps: 'Any Craps', eleven: 'Eleven' };
const CR_CHIPS = [5, 25, 100, 500];
const CR_FIELD_WIN = [2, 3, 4, 9, 10, 11, 12];

let crUnsub = null;
let crTimerId = null;

// ----------------------------------------------------------------------------
// PURE LOGIC (no DOM, no globals) — unit tested in craps.test.js
// ----------------------------------------------------------------------------
function crInt(x) {
  const n = Math.floor(Number(x));
  return Number.isFinite(n) && n > 0 ? n : 0;
}

// Fill in defaults for a missing/partial table doc.
function crNormalize(doc) {
  const d = doc || {};
  return {
    rollNumber: crInt(d.rollNumber),
    phase: (d.phase === 'betting' || d.phase === 'rolling' || d.phase === 'result') ? d.phase : 'result',
    phaseEndsAt: Number(d.phaseEndsAt) || 0,
    point: CR_POINTS.indexOf(d.point) >= 0 ? d.point : null,
    roll: (d.roll && Array.isArray(d.roll.dice)) ? d.roll : null,
    bets: (d.bets && typeof d.bets === 'object') ? d.bets : {},
    history: Array.isArray(d.history) ? d.history : [],
    shooterName: d.shooterName || null,
  };
}

// The point after a roll resolves.
function crPointAfter(pointBefore, total) {
  if (pointBefore == null) return CR_POINTS.indexOf(total) >= 0 ? total : null;
  return (total === pointBefore || total === 7) ? null : pointBefore;
}

function crDie(randomDie) {
  const v = Math.floor(Number(randomDie()));
  if (!(v >= 1 && v <= 6)) throw new Error('bad die value');
  return v;
}

// Pure phase machine. Returns null when nothing is due, else a patch of doc
// fields to merge. Caller supplies the clock, a die source, and a shooter name.
function crNextPhase(doc, nowMs, randomDie, shooterName) {
  const d = crNormalize(doc);
  if (nowMs < d.phaseEndsAt) return null;
  if (d.phase === 'betting') {
    const d1 = crDie(randomDie), d2 = crDie(randomDie);
    const total = d1 + d2;
    const n = Math.max(d.rollNumber, d.roll ? crInt(d.roll.n) : 0) + 1;
    return {
      phase: 'rolling',
      phaseEndsAt: nowMs + CR_ROLLING_MS,
      roll: { n, dice: [d1, d2], total, pointBefore: d.point, pointAfter: crPointAfter(d.point, total) },
      shooterName: shooterName || null,
    };
  }
  if (d.phase === 'rolling') {
    if (!d.roll) return { phase: 'betting', phaseEndsAt: nowMs + CR_BETTING_MS }; // corrupt doc: recover
    const history = d.history.concat([{ total: d.roll.total, n: d.roll.n }]).slice(-12);
    return {
      phase: 'result',
      phaseEndsAt: nowMs + CR_RESULT_MS,
      point: d.roll.pointAfter == null ? null : d.roll.pointAfter,
      history,
    };
  }
  // result -> betting (bets that are still riding stay on the table)
  return {
    phase: 'betting',
    phaseEndsAt: nowMs + CR_BETTING_MS,
    rollNumber: d.roll ? crInt(d.roll.n) : d.rollNumber,
  };
}

function crEntryTotal(e) {
  if (!e) return 0;
  return CR_BET_KEYS.reduce((s, k) => s + crInt(e[k]), 0);
}

// Resolve one player's bets against one roll.
// credit = what to ADD to chips (stake was already deducted when betting):
//   win -> stake + profit, push -> stake, lose -> 0. Riding pass/DP credit 0
//   and are returned in `remaining` (they stay on the table).
function crResolve(roll, bets) {
  const b = {};
  CR_BET_KEYS.forEach(k => { b[k] = crInt(bets && bets[k]); });
  const t = roll.total;
  const pb = roll.pointBefore == null ? null : roll.pointBefore;
  const lines = [];
  let credit = 0;
  const remaining = { pass: 0, dontPass: 0 };
  function settle(key, outcome, mult) {
    const stake = b[key];
    if (stake <= 0) return;
    if (outcome === 'win') { credit += stake + stake * mult; lines.push({ label: CR_LABELS[key], outcome, net: stake * mult }); }
    else if (outcome === 'push') { credit += stake; lines.push({ label: CR_LABELS[key], outcome, net: 0 }); }
    else { lines.push({ label: CR_LABELS[key], outcome: 'lose', net: -stake }); }
  }
  let pass = 'ride', dp = 'ride';
  if (pb == null) {
    if (t === 7 || t === 11) { pass = 'win'; dp = 'lose'; }
    else if (t === 2 || t === 3) { pass = 'lose'; dp = 'win'; }
    else if (t === 12) { pass = 'lose'; dp = 'push'; }
  } else if (t === pb) { pass = 'win'; dp = 'lose'; }
  else if (t === 7) { pass = 'lose'; dp = 'win'; }
  if (pass === 'ride') remaining.pass = b.pass; else settle('pass', pass, 1);
  if (dp === 'ride') remaining.dontPass = b.dontPass; else settle('dontPass', dp, 1);
  // One-roll bets resolve on every roll.
  if (CR_FIELD_WIN.indexOf(t) >= 0) settle('field', 'win', t === 2 ? 2 : t === 12 ? 3 : 1); else settle('field', 'lose', 0);
  settle('any7', t === 7 ? 'win' : 'lose', 4);
  settle('anyCraps', (t === 2 || t === 3 || t === 12) ? 'win' : 'lose', 7);
  settle('eleven', t === 11 ? 'win' : 'lose', 15);
  return { credit, remaining, lines };
}

// Settle a table-doc bets entry against the latest roll. Returns
// { entry, credit, net, lines } where `entry` is the full replacement entry.
// If the player missed more than one roll we can't resolve them fairly, so
// everything on the table is returned (void) rather than guessed at.
function crSettleEntry(roll, entry) {
  const e = entry || {};
  const gap = roll.n - crInt(e.settledRoll);
  let credit, remaining, lines;
  if (gap > 1) {
    credit = crEntryTotal(e);
    remaining = { pass: 0, dontPass: 0 };
    lines = [{ label: 'Bets returned (missed rolls)', outcome: 'push', net: 0 }];
  } else {
    const r = crResolve(roll, e);
    credit = r.credit; remaining = r.remaining; lines = r.lines;
  }
  const net = lines.reduce((s, l) => s + l.net, 0);
  return {
    credit, net, lines,
    entry: {
      name: e.name || 'Player', photoURL: e.photoURL || null,
      pass: remaining.pass, dontPass: remaining.dontPass, field: 0, any7: 0, anyCraps: 0, eleven: 0,
      settledRoll: roll.n,
      last: { n: roll.n, net, lines },
    },
  };
}

function crDescribeRoll(roll) {
  if (!roll) return '';
  const t = roll.total, pb = roll.pointBefore == null ? null : roll.pointBefore;
  if (pb == null) {
    if (t === 7 || t === 11) return 'Natural ' + t + ' — Pass Line wins';
    if (t === 12) return "Craps 12 — Pass loses, Don't Pass pushes";
    if (t === 2 || t === 3) return 'Craps ' + t + " — Pass loses, Don't Pass wins";
    return 'Point is ' + t;
  }
  if (t === pb) return 'Point made! ' + t + ' — Pass Line wins';
  if (t === 7) return "Seven out — Pass Line loses, Don't Pass wins";
  return 'Rolled ' + t + ' — point is still ' + pb;
}

// Unbiased 1-6 using crypto (rejection sampling on a byte).
function crRandomDie() {
  const buf = new Uint8Array(1);
  for (;;) {
    crypto.getRandomValues(buf);
    if (buf[0] < 252) return 1 + (buf[0] % 6);
  }
}

if (typeof module !== 'undefined' && module.exports) {
  module.exports = { crNormalize, crPointAfter, crNextPhase, crResolve, crSettleEntry, crDescribeRoll, crEntryTotal, crRandomDie, crInt };
}

// ----------------------------------------------------------------------------
// MODULE STATE (state.cr, created lazily)
// ----------------------------------------------------------------------------
function crEnsure() {
  if (!state.cr) {
    state.cr = {
      table: null, lastError: null, chip: 25,
      q: Promise.resolve(), settleP: null, settleAt: 0, advanceAt: 0,
      optChips: null, optAt: 0,
      lastTickKey: null, rollSoundN: null, lastWinRoll: null, lockedKey: null,
    };
  }
  return state.cr;
}

function crSound(name, arg) {
  try {
    if (typeof Sound === 'undefined' || !Sound.enabled || typeof Sound[name] !== 'function') return;
    Sound[name](arg);
  } catch (e) { /* sound is never worth breaking the table for */ }
}

function crMyUid() { return state.user ? state.user.uid : null; }
function crMyName() {
  return (state.employee && state.employee.name) || (state.user && state.user.displayName) || 'Player';
}
function crRef() { return db.collection('crapsTables').doc(CR_DOC_ID); }

function crFail(e) {
  console.error('craps error', e);
  const cr = crEnsure();
  cr.lastError = (e && e.message) || String(e);
  try { render(); } catch (x) { /* ignore */ }
}

// Serialises my bet/clear actions so chip checks and writes can't interleave.
function crEnqueue(fn) {
  const cr = crEnsure();
  const p = cr.q.then(fn);
  cr.q = p.catch(() => {});
  return p;
}

// Chips I can spend. state.chips lags a moment behind my own debit, so for a
// couple of seconds we trust the lower of (snapshot, what we just computed).
function crAvail() {
  const cr = crEnsure();
  let c = state.chips == null ? 0 : state.chips;
  if (cr.optChips != null && Date.now() - cr.optAt < 2500) c = Math.min(c, cr.optChips);
  return c;
}

// ----------------------------------------------------------------------------
// LIFECYCLE
// ----------------------------------------------------------------------------
function enterCrapsScreen() {
  const cr = crEnsure();
  if (crUnsub || crTimerId) leaveCrapsScreen();
  cr.table = null; cr.lastError = null;
  cr.optChips = null; cr.optAt = 0;
  cr.lastTickKey = null; cr.rollSoundN = null; cr.lockedKey = null;
  cr.advanceAt = 0; cr.settleAt = 0;
  crUnsub = crRef().onSnapshot(snap => {
    try {
      cr.table = snap.exists ? snap.data() : {};
      cr.lockedKey = null;
      crSoundsOnSnapshot();
      crMaybeSettle();
    } catch (e) { console.error('craps snapshot handler', e); cr.lastError = e.message || String(e); }
    render();
  }, err => {
    console.error('craps listener error', err);
    cr.lastError = err.message || String(err);
    render();
  });
  crTimerId = setInterval(crTick, 1000);
}

function leaveCrapsScreen() {
  if (crUnsub) { try { crUnsub(); } catch (e) {} crUnsub = null; }
  if (crTimerId) { clearInterval(crTimerId); crTimerId = null; }
  const cr = state.cr;
  if (cr) { cr.table = null; cr.lastError = null; cr.settleP = null; }
}

// ----------------------------------------------------------------------------
// ADVANCING THE TABLE (any client) + SETTLING MY BETS
// ----------------------------------------------------------------------------
function crJitter(uid) {
  let h = 0;
  const s = String(uid || '');
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return h % 1501;
}

async function crAdvance() {
  const ref = crRef();
  const name = crMyName();
  await db.runTransaction(async tx => {
    const snap = await tx.get(ref);
    const raw = snap.exists ? snap.data() : {};
    // Deadline re-checked against the fresh doc: if someone else already
    // advanced it, crNextPhase returns null and we write nothing.
    const patch = crNextPhase(raw, Date.now(), crRandomDie, name);
    if (!patch) return;
    tx.set(ref, patch, { merge: true });
  });
}

function crTick() {
  const cr = state.cr;
  if (!cr || state.screen !== 'craps' || !state.user) return;
  try {
    const d = crNormalize(cr.table);
    const now = Date.now();
    if (cr.table && now >= d.phaseEndsAt + crJitter(crMyUid()) && now - cr.advanceAt >= 3000) {
      cr.advanceAt = now;
      crAdvance().catch(e => console.error('craps advance', e));
    }
    crMaybeSettle();
    crTickUi(d, now);
  } catch (e) { console.error('crTick', e); }
}

// Update the countdown in place (no full re-render, so taps aren't swallowed).
function crTickUi(d, now) {
  const cr = state.cr;
  const secs = Math.max(0, Math.ceil((d.phaseEndsAt - now) / 1000));
  const el = document.getElementById('cr-secs');
  if (el) el.textContent = d.phaseEndsAt ? String(secs) : '';
  if (d.phase === 'betting') {
    if (secs > 0 && secs <= 5) {
      const key = d.rollNumber + ':' + secs;
      if (cr.lastTickKey !== key) { cr.lastTickKey = key; crSound('tick'); }
    }
    // Deadline passed locally: re-render once so the bet zones lock.
    if (secs === 0 && cr.lockedKey !== d.rollNumber) { cr.lockedKey = d.rollNumber; render(); }
  }
}

function crSoundsOnSnapshot() {
  const cr = state.cr;
  const d = crNormalize(cr.table);
  if (d.phase === 'rolling' && d.roll && cr.rollSoundN !== d.roll.n) {
    cr.rollSoundN = d.roll.n;
    // Only rattle if the roll just started (not when opening the screen mid-roll).
    if (Date.now() - (d.phaseEndsAt - CR_ROLLING_MS) < 900) {
      [0, 0.22, 0.45, 0.8, 1.25].forEach(t => crSound('cardFlick', t));
    }
  }
}

function crMaybeSettle() {
  const cr = state.cr;
  const uid = crMyUid();
  if (!cr || !uid || !cr.table) return;
  const d = crNormalize(cr.table);
  if (d.phase === 'rolling' || !d.roll) return;
  const e = d.bets[uid];
  if (!e || crEntryTotal(e) <= 0 || crInt(e.settledRoll) >= d.roll.n) return;
  const now = Date.now();
  if (cr.settleP || now - cr.settleAt < 2500) return;
  cr.settleAt = now;
  crSettleMine();
}

// Settle MY entry against the latest roll. The transaction closure has no side
// effects (it only assigns `res`, reset on every retry); chips are credited
// afterwards and ONLY if this transaction is the one that settled.
function crSettleMine() {
  const cr = crEnsure();
  if (cr.settleP) return cr.settleP;
  const uid = crMyUid();
  if (!uid) return Promise.resolve();
  const ref = crRef();
  const p = (async () => {
    let res = null;
    await db.runTransaction(async tx => {
      res = null;
      const snap = await tx.get(ref);
      if (!snap.exists) return;
      const d = crNormalize(snap.data());
      if (d.phase === 'rolling' || !d.roll) return;
      const e = d.bets[uid];
      if (!e || crEntryTotal(e) <= 0 || crInt(e.settledRoll) >= d.roll.n) return;
      const r = crSettleEntry(d.roll, e);
      tx.update(ref, { ['bets.' + uid]: r.entry });
      res = { credit: r.credit, net: r.net, n: d.roll.n };
    });
    if (res) {
      cr.optAt = 0;
      if (res.credit > 0) await applyChipDelta(res.credit);
      if (res.net > 0 && cr.lastWinRoll !== res.n) { cr.lastWinRoll = res.n; crSound('win'); }
    }
  })().catch(e => crFail(e)).then(() => { cr.settleP = null; });
  cr.settleP = p;
  return p;
}

// ----------------------------------------------------------------------------
// PLACING / CLEARING BETS
// ----------------------------------------------------------------------------
function crBettingOpen(d, now) { return d.phase === 'betting' && now < d.phaseEndsAt; }

async function crPlaceBet(zone, amount) {
  const cr = crEnsure();
  const uid = crMyUid();
  if (!uid || CR_BET_KEYS.indexOf(zone) < 0) return;
  amount = crInt(amount);
  if (amount <= 0) return;
  try {
    await crEnqueue(async () => {
      if (!cr.table) throw new Error('The table is still loading.');
      const d0 = crNormalize(cr.table);
      if (!crBettingOpen(d0, Date.now())) throw new Error('Betting is closed — wait for the next roll.');
      if ((zone === 'pass' || zone === 'dontPass') && d0.point != null) throw new Error('Pass Line and Don’t Pass can only be bet on the come-out roll.');
      if (amount > crAvail()) throw new Error('Not enough chips for that bet.');
      await crSettleMine();               // make sure my last roll is settled first
      const before = crAvail();
      await applyChipDelta(-amount);      // chips leave my stack at bet time
      cr.optChips = before - amount; cr.optAt = Date.now();
      const name = crMyName();
      const photoURL = (state.employee && state.employee.photoURL) || null;
      try {
        await db.runTransaction(async tx => {
          const snap = await tx.get(crRef());
          if (!snap.exists) throw new Error('The table is not open yet.');
          const d = crNormalize(snap.data());
          if (!crBettingOpen(d, Date.now())) throw new Error('Betting is closed — wait for the next roll.');
          if ((zone === 'pass' || zone === 'dontPass') && d.point != null) throw new Error('Pass Line and Don’t Pass can only be bet on the come-out roll.');
          const cur = d.bets[uid] || null;
          const lastN = d.roll ? crInt(d.roll.n) : 0;
          if (cur && crEntryTotal(cur) > 0 && crInt(cur.settledRoll) < lastN) throw new Error('Still settling your last roll — try again in a second.');
          const e = { name, photoURL, pass: 0, dontPass: 0, field: 0, any7: 0, anyCraps: 0, eleven: 0 };
          if (cur) CR_BET_KEYS.forEach(k => { e[k] = crInt(cur[k]); });
          if (cur && cur.last) e.last = cur.last;
          e.settledRoll = lastN;
          e[zone] += amount;
          tx.update(crRef(), { ['bets.' + uid]: e });
        });
      } catch (err) {
        cr.optAt = 0;
        await applyChipDelta(amount);     // refund: the bet never reached the table
        throw err;
      }
      crSound('chip');
    });
  } catch (e) { crFail(e); }
}

// Take down everything that is removable right now, refunding it.
async function crClearBets() {
  const cr = crEnsure();
  const uid = crMyUid();
  if (!uid) return;
  try {
    await crEnqueue(async () => {
      if (!cr.table) return;
      if (!crBettingOpen(crNormalize(cr.table), Date.now())) throw new Error('Betting is closed — bets can no longer be taken down.');
      await crSettleMine();
      let refund = 0;
      await db.runTransaction(async tx => {
        refund = 0;
        const snap = await tx.get(crRef());
        if (!snap.exists) return;
        const d = crNormalize(snap.data());
        if (!crBettingOpen(d, Date.now())) throw new Error('Betting is closed — bets can no longer be taken down.');
        const cur = d.bets[uid];
        if (!cur) return;
        const lastN = d.roll ? crInt(d.roll.n) : 0;
        if (crEntryTotal(cur) > 0 && crInt(cur.settledRoll) < lastN) throw new Error('Still settling your last roll — try again in a second.');
        const e = Object.assign({}, cur);
        CR_ONE_ROLL.forEach(k => { refund += crInt(cur[k]); e[k] = 0; });
        if (d.point == null) { // come-out: pass/DP are fresh, so they can come down. With a point on they ride.
          ['pass', 'dontPass'].forEach(k => { refund += crInt(cur[k]); e[k] = 0; });
        }
        if (refund <= 0) return;
        e.settledRoll = lastN;
        tx.update(crRef(), { ['bets.' + uid]: e });
      });
      if (refund > 0) { cr.optAt = 0; await applyChipDelta(refund); crSound('chip'); }
    });
  } catch (e) { crFail(e); }
}

// ----------------------------------------------------------------------------
// RENDERING
// ----------------------------------------------------------------------------
const CR_PIPS = { 1: [5], 2: [1, 9], 3: [1, 5, 9], 4: [1, 3, 7, 9], 5: [1, 3, 5, 7, 9], 6: [1, 3, 4, 6, 7, 9] };
const CR_SPIN = [
  { sx: 1080, sy: 1260, sz: 200, hx: -86 },
  { sx: 900, sy: 1440, sz: -240, hx: 86 },
];

function crFaceHtml(v) {
  let cells = '';
  for (let i = 1; i <= 9; i++) cells += CR_PIPS[v].indexOf(i) >= 0 ? '<i class="cr-pip"></i>' : '<b></b>';
  return '<div class="cr-face cr-f' + v + '">' + cells + '</div>';
}
function crDieHtml(v, idx) {
  const s = CR_SPIN[idx];
  let faces = '';
  for (let f = 1; f <= 6; f++) faces += crFaceHtml(f);
  return '<div class="cr-die-hop" style="--hx:' + s.hx + 'px;--sx:' + s.sx + 'deg;--sy:' + s.sy + 'deg;--sz:' + s.sz + 'deg">' +
    '<div class="cr-die-tilt"><div class="cr-cube cr-v' + v + '">' + faces + '</div></div></div>';
}

function crDiceHtml(d, now) {
  const dice = d.roll ? d.roll.dice : [5, 2];
  let cls = 'cr-dice';
  let style = '';
  if (d.phase === 'rolling' && d.roll) {
    const elapsed = Math.max(0, now - (d.phaseEndsAt - CR_ROLLING_MS));
    // Re-apply the animation from the right offset on every render so a
    // re-render (which rebuilds the DOM) never restarts the tumble.
    if (elapsed < CR_ANIM_MS) { cls += ' cr-rolling'; style = ' style="--dl:-' + Math.round(elapsed) + 'ms"'; }
  }
  return '<div class="' + cls + '"' + style + '>' + crDieHtml(dice[0], 0) + crDieHtml(dice[1], 1) + '</div>';
}

function crPointRowHtml(d) {
  const off = d.point == null;
  let h = '<div class="cr-points"><div class="cr-pt cr-pt-puck">' +
    (off ? '<span class="cr-puck off">OFF</span>' : '<span class="cr-pt-lbl">POINT</span>') + '</div>';
  CR_POINTS.forEach(p => {
    const on = d.point === p;
    h += '<div class="cr-pt' + (on ? ' on' : '') + '">' + (on ? '<span class="cr-puck on">ON</span>' : '') + '<span class="cr-pt-num">' + p + '</span></div>';
  });
  return h + '</div>';
}

function crHistoryHtml(d) {
  const items = d.history.slice(-12).reverse();
  if (!items.length) return '<div class="cr-hist"><span class="cr-hist-lbl">Rolls</span><span class="cr-hist-empty">none yet</span></div>';
  return '<div class="cr-hist"><span class="cr-hist-lbl">Rolls</span>' + items.map((h, i) => {
    const t = h.total;
    const c = t === 7 ? ' seven' : t === 11 ? ' yo' : (t === 2 || t === 3 || t === 12) ? ' craps' : '';
    return '<span class="cr-h' + c + (i === 0 ? ' last' : '') + '">' + t + '</span>';
  }).join('') + '</div>';
}

function crStatusHtml(d, now) {
  const secs = Math.max(0, Math.ceil((d.phaseEndsAt - now) / 1000));
  const secEl = '<span class="cr-secs" id="cr-secs">' + (d.phaseEndsAt ? secs : '') + '</span>';
  let head, sub = '', total = '';
  if (d.phase === 'betting') {
    head = d.point == null ? 'Come-out roll — place your bets' : 'Point is ' + d.point + ' — bets open';
    sub = d.point == null ? 'Pass wins on 7 or 11, loses on 2, 3, 12. Any other number becomes the point.' : 'Pass wins if ' + d.point + ' rolls before a 7.';
    total = secEl + 's';
  } else if (d.phase === 'rolling') {
    head = d.shooterName ? escapeHtml(d.shooterName) + ' rolls…' : 'Rolling…';
    sub = d.point == null ? 'Come-out roll' : 'Point is ' + d.point;
  } else {
    head = d.roll ? escapeHtml(crDescribeRoll(d.roll)) : 'Waiting for the first roll…';
    if (d.roll) sub = d.roll.dice[0] + ' + ' + d.roll.dice[1] + ' = ' + d.roll.total + (d.shooterName ? ' · ' + escapeHtml(d.shooterName) + ' rolled' : '');
  }
  const total_ms = d.phase === 'betting' ? CR_BETTING_MS : d.phase === 'rolling' ? CR_ROLLING_MS : CR_RESULT_MS;
  const elapsed = Math.min(total_ms, Math.max(0, total_ms - (d.phaseEndsAt - now)));
  const timer = d.phaseEndsAt ? '<div class="cr-timer"><i style="animation-duration:' + total_ms + 'ms;animation-delay:-' + Math.round(elapsed) + 'ms"></i></div>' : '';
  return '<div class="cr-status"><div class="cr-head">' + head + (total ? ' <span class="cr-count">' + total + '</span>' : '') + '</div>' +
    (sub ? '<div class="cr-sub">' + sub + '</div>' : '') + timer + '</div>';
}

function crSlotHtml(e, key, ride) {
  const v = e ? crInt(e[key]) : 0;
  if (!v) return '<span class="cr-slot"></span>';
  return '<span class="cr-slot"><span class="cr-badge' + (ride ? ' ride' : '') + '"><span class="chip-icon"></span>' + v + (ride ? '<em>riding</em>' : '') + '</span></span>';
}

function crBoardHtml(d, now, mine) {
  const open = crBettingOpen(d, now);
  const passOk = open && d.point == null;
  const rideP = d.point != null;
  function zone(key, cls, inner, ok, ride) {
    return '<button class="cr-zone ' + cls + '" data-cr-zone="' + key + '"' + (ok ? '' : ' disabled') + '>' + inner + crSlotHtml(mine, key, ride) + '</button>';
  }
  const fieldNums = CR_FIELD_WIN.map(n => '<span class="cr-fn' + (n === 2 || n === 12 ? ' x' : '') + '">' + n + (n === 2 ? '<sup>2:1</sup>' : n === 12 ? '<sup>3:1</sup>' : '') + '</span>').join('');
  return '<div class="cr-board">' +
    zone('field', 'cr-field', '<span class="cr-zn">Field</span><span class="cr-fnums">' + fieldNums + '</span><span class="cr-pay">Pays 1 to 1 · 5 6 7 8 lose</span>', open, false) +
    '<div class="cr-row2">' +
      zone('pass', 'cr-pass', '<span class="cr-zn">Pass Line</span><span class="cr-pay">1 to 1 · ' + (passOk ? 'come-out only' : rideP ? 'point is on' : 'closed') + '</span>', passOk, rideP) +
      zone('dontPass', 'cr-dp', '<span class="cr-zn">Don’t Pass Bar</span><span class="cr-pay">1 to 1 · bar 12</span>', passOk, rideP) +
    '</div>' +
    '<div class="cr-row3">' +
      zone('any7', 'cr-prop', '<span class="cr-zn">Any Seven</span><span class="cr-pay big">4 to 1</span>', open, false) +
      zone('anyCraps', 'cr-prop', '<span class="cr-zn">Any Craps</span><span class="cr-pay big">7 to 1</span>', open, false) +
      zone('eleven', 'cr-prop', '<span class="cr-zn">Eleven</span><span class="cr-pay big">15 to 1</span>', open, false) +
    '</div></div>';
}

function crLineText(l) {
  if (l.outcome === 'win') return l.label + ' wins +' + l.net;
  if (l.outcome === 'lose') return l.label + ' loses −' + Math.abs(l.net);
  return l.label + ' pushes';
}
function crNetText(n) { return n > 0 ? '+' + n : n < 0 ? '−' + Math.abs(n) : '0'; }

function crResultHtml(d, mine) {
  if (!mine || !mine.last || !d.roll || d.phase === 'rolling' || mine.last.n !== d.roll.n || !mine.last.lines.length) return '';
  const l = mine.last;
  return '<div class="cr-panel cr-res"><div class="cr-ptitle">Your results — roll ' + d.roll.total + '</div>' +
    l.lines.map(x => '<div class="cr-line ' + x.outcome + '"><span>' + escapeHtml(crLineText(x)) + '</span></div>').join('') +
    '<div class="cr-line net ' + (l.net > 0 ? 'win' : l.net < 0 ? 'lose' : 'push') + '"><span>Net</span><strong>' + crNetText(l.net) + '</strong></div></div>';
}

function crBreakdown(e) {
  return CR_BET_KEYS.filter(k => crInt(e[k]) > 0).map(k => CR_LABELS[k] + ' ' + crInt(e[k])).join(' · ');
}

function crTablePanelHtml(d) {
  const uid = crMyUid();
  const rows = Object.keys(d.bets).filter(u => u !== uid).map(u => ({ u, e: d.bets[u] || {} }))
    .map(x => {
      const showLast = x.e.last && d.roll && x.e.last.n === d.roll.n && d.phase !== 'rolling';
      return { u: x.u, e: x.e, total: crEntryTotal(x.e), last: showLast ? x.e.last : null };
    })
    .filter(x => x.total > 0 || x.last)
    .sort((a, b) => b.total - a.total).slice(0, 12);
  let body;
  if (!rows.length) body = '<div class="cr-empty">No other players have bets down.</div>';
  else body = rows.map(x => {
    const net = x.last ? '<span class="cr-pnet ' + (x.last.net > 0 ? 'win' : x.last.net < 0 ? 'lose' : 'push') + '">' + crNetText(x.last.net) + '</span>' : '';
    return '<div class="cr-prow">' + avatarHtml(x.e.name || 'Player', x.e.photoURL, 30) +
      '<div class="cr-pinfo"><div class="cr-pname">' + escapeHtml(x.e.name || 'Player') + '</div>' +
      '<div class="cr-pbets">' + (x.total > 0 ? escapeHtml(crBreakdown(x.e)) : 'nothing riding') + '</div></div>' +
      '<div class="cr-ptotal">' + (x.total > 0 ? '<span class="chip-icon"></span>' + x.total : '') + net + '</div></div>';
  }).join('');
  return '<div class="cr-panel"><div class="cr-ptitle">At the table</div>' + body + '</div>';
}

function renderCrapsScreen() {
  const cr = crEnsure();
  const now = Date.now();
  const topbar = '<div class="topbar"><h1 class="page-title casino-title" style="font-size:24px;">Craps</h1>' +
    '<div style="display:flex;align-items:center;gap:8px;">' +
    '<button class="sound-toggle" id="cr-sound-toggle" title="' + (Sound.enabled ? 'Mute sound' : 'Unmute sound') + '">' + (Sound.enabled ? '🔊' : '🔇') + '</button>' +
    '<button class="btn btn-ghost btn-sm" id="cr-done">Done</button></div></div>';
  const err = cr.lastError ? '<div class="cr-err"><span>' + escapeHtml(cr.lastError) + '</span><button class="btn btn-ghost btn-sm" id="cr-dismiss-error" style="flex-shrink:0;">Dismiss</button></div>' : '';
  if (!cr.table) return topbar + '<div class="content">' + err + '<div style="padding:40px;text-align:center;color:var(--text-tertiary);">Loading table…</div></div>';
  const d = crNormalize(cr.table);
  const uid = crMyUid();
  const mine = uid ? d.bets[uid] : null;
  const avail = crAvail();
  const mineTotal = crEntryTotal(mine);
  const sky = (typeof PK_SKYLINE_SVG !== 'undefined') ? PK_SKYLINE_SVG : '';
  return topbar + '<div class="content cr-content">' + err +
    '<div class="chip-count" style="justify-content:center;color:var(--gold-bright);margin-bottom:12px;"><span class="chip-icon"></span>' + (state.chips == null ? 0 : state.chips) + ' chips</div>' +
    '<div class="cr-stage"><div class="cr-room">' + sky + '</div>' +
      crDiceHtml(d, now) + crPointRowHtml(d) + crStatusHtml(d, now) + crHistoryHtml(d) + '</div>' +
    crBoardHtml(d, now, mine) +
    '<div class="cr-bar"><div class="cr-chips">' +
      CR_CHIPS.map(v => '<button class="cr-chip c' + v + (cr.chip === v ? ' sel' : '') + '" data-cr-chip="' + v + '" aria-label="Chip ' + v + '"><span>' + v + '</span></button>').join('') +
    '</div><div class="cr-barbtns"><div class="cr-onbet">On table <strong>' + mineTotal + '</strong></div><button class="cr-clear" id="cr-clear">Clear</button></div></div>' +
    ((state.chips || 0) === 0 && mineTotal === 0 ? '<button class="btn btn-ghost btn-sm btn-block" id="cr-get-chips" style="margin-bottom:12px;">Get More Chips</button>' : '') +
    crResultHtml(d, mine) + crTablePanelHtml(d) +
    '<div class="cr-foot">Chips leave your stack when you bet. Pass and Don’t Pass ride until the point is made or a 7 is rolled; the other bets resolve every roll.</div>' +
  '</div>';
}

function attachCrapsHandlers() {
  const cr = crEnsure();
  const on = (id, fn) => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('click', () => { try { fn(); } catch (e) { crFail(e); } });
  };
  on('cr-sound-toggle', () => { Sound.setEnabled(!Sound.enabled); render(); });
  on('cr-dismiss-error', () => { cr.lastError = null; render(); });
  on('cr-done', () => { leaveCrapsScreen(); state.screen = 'home'; render(); });
  on('cr-clear', () => { crClearBets(); });
  on('cr-get-chips', () => { resetChips(); });
  document.querySelectorAll('[data-cr-chip]').forEach(el => el.addEventListener('click', () => {
    cr.chip = parseInt(el.dataset.crChip, 10) || 25;
    render();
  }));
  document.querySelectorAll('[data-cr-zone]').forEach(el => el.addEventListener('click', () => {
    try { crPlaceBet(el.dataset.crZone, cr.chip); } catch (e) { crFail(e); }
  }));
}

</script>
<script>
// ===== Slots =====
// ============================================================================
// SLOTS — "Gilded Reels": a solo 3-reel / 1-payline video slot. No Firestore
// table of its own: chips are debited at spin start with applyChipDelta(-bet)
// and credited (once, guarded by a per-spin `settled` flag) when the reels stop.
//
// Runs as a separate classic <script> AFTER the main script and uses its
// globals: state, escapeHtml, applyChipDelta, resetChips, render, Sound.
// Everything here is prefixed sl / SL_ / Sl. Pure logic (paytable, strips,
// RTP) has no DOM dependency and is unit-tested in slots.test.js.
// ============================================================================

const SL_LEN = 24;                  // stops per reel strip
const SL_REPS = 6;                  // strip repetitions in the animated DOM strip
const SL_BETS = [5, 10, 25, 50, 100];
const SL_BIG_MULT = 25;             // >= this multiplier gets the BIG WIN banner
const SL_AUTO_SPINS = 10;
const SL_STOP_MS = [1000, 1500, 2100];
const SL_STOP_MS_REDUCED = [380, 560, 740];
const SL_LOOPS = [1, 2, 3];         // full strip loops each reel travels (keeps speeds similar)
const SL_BET_KEY = 'slBet';
const SL_PENDING_KEY = 'slPending';

// Symbol ids (also the SVG <symbol id="sl-s-NAME"> names).
const SL_SYMBOLS = ['cherry', 'lemon', 'plum', 'bell', 'gem', 'seven', 'star'];
const SL_LABEL = { cherry: 'Cherry', lemon: 'Lemon', plum: 'Plum', bell: 'Bell', gem: 'Gem', seven: 'Seven', star: 'Star' };
const SL_PLURAL = { cherry: 'Cherries', lemon: 'Lemons', plum: 'Plums', bell: 'Bells', gem: 'Gems', seven: 'Sevens', star: 'Stars' };

// Three of a kind on the payline (multiplier of the bet, stake included).
const SL_PAY3 = { seven: 100, gem: 50, bell: 25, star: 20, plum: 15, lemon: 10, cherry: 8 };
const SL_PAY_CHERRY2 = 2;           // exactly two cherries anywhere on the payline
const SL_PAY_CHERRY1 = 1;           // exactly one cherry (returns the bet)

// Weights per 24-stop reel. Exact RTP is computed by slComputeRtp (~92.5%).
const SL_COUNTS = { cherry: 4, lemon: 5, plum: 4, bell: 4, gem: 2, star: 3, seven: 2 };

// ---------------------------------------------------------------------------
// PURE LOGIC
// ---------------------------------------------------------------------------
// Build a 24-stop strip from the weights. Placement uses a stride coprime with
// 24 so identical symbols are spread out (no equal neighbours, checked in tests).
function slBuildStrip(counts, stride, rot) {
  const order = SL_SYMBOLS.slice().sort((a, b) => counts[b] - counts[a] || SL_SYMBOLS.indexOf(a) - SL_SYMBOLS.indexOf(b));
  const r = ((rot % order.length) + order.length) % order.length;
  const rotated = order.slice(r).concat(order.slice(0, r));
  const flat = [];
  rotated.forEach(s => { for (let k = 0; k < counts[s]; k++) flat.push(s); });
  const strip = new Array(flat.length);
  for (let i = 0; i < flat.length; i++) strip[(i * stride) % flat.length] = flat[i];
  return strip;
}
const SL_STRIPS = [slBuildStrip(SL_COUNTS, 5, 0), slBuildStrip(SL_COUNTS, 7, 2), slBuildStrip(SL_COUNTS, 11, 4)];

// Evaluate the three payline symbols -> { mult, kind, hits:[bool,bool,bool] }
function slEvaluate(syms) {
  if (!Array.isArray(syms) || syms.length !== 3) return { mult: 0, kind: 'none', hits: [false, false, false] };
  const [a, b, c] = syms;
  if (a === b && b === c && SL_PAY3[a]) return { mult: SL_PAY3[a], kind: 'three', symbol: a, hits: [true, true, true] };
  const hits = syms.map(s => s === 'cherry');
  const n = hits.filter(Boolean).length;
  if (n === 2) return { mult: SL_PAY_CHERRY2, kind: 'cherry2', symbol: 'cherry', hits };
  if (n === 1) return { mult: SL_PAY_CHERRY1, kind: 'cherry1', symbol: 'cherry', hits };
  return { mult: 0, kind: 'none', hits: [false, false, false] };
}
function slPayout(syms) { return slEvaluate(syms).mult; }

// Exact RTP: enumerate every stop combination of the three reels.
function slComputeRtp(strips) {
  const s = strips || SL_STRIPS;
  let total = 0, combos = 0;
  for (let i = 0; i < s[0].length; i++)
    for (let j = 0; j < s[1].length; j++)
      for (let k = 0; k < s[2].length; k++) {
        total += slPayout([s[0][i], s[1][j], s[2][k]]);
        combos++;
      }
  return total / combos;
}
// Share of spins that pay anything (for the notes / sanity).
function slHitRate(strips) {
  const s = strips || SL_STRIPS;
  let hit = 0, combos = 0;
  for (let i = 0; i < s[0].length; i++)
    for (let j = 0; j < s[1].length; j++)
      for (let k = 0; k < s[2].length; k++) {
        if (slPayout([s[0][i], s[1][j], s[2][k]]) > 0) hit++;
        combos++;
      }
  return hit / combos;
}

// Unbiased integer in [0, n) using crypto.getRandomValues (rejection sampling).
function slRandInt(n) {
  const c = (typeof crypto !== 'undefined' && crypto.getRandomValues) ? crypto : null;
  if (!c) return Math.floor(Math.random() * n);
  const lim = Math.floor(0x100000000 / n) * n;
  const a = new Uint32Array(1);
  let x;
  do { c.getRandomValues(a); x = a[0]; } while (x >= lim);
  return x % n;
}
// Injectable RNG (tests / harness). rng(n) must return an integer in [0, n).
let slRng = slRandInt;
function slSetRng(fn) { slRng = typeof fn === 'function' ? fn : slRandInt; }

// Independent stop index per reel; anything out of range falls back to the CSPRNG.
function slPickStops(rng, strips) {
  const s = strips || SL_STRIPS;
  return s.map(strip => {
    let v = rng(strip.length);
    if (!(Number.isInteger(v) && v >= 0 && v < strip.length)) v = slRandInt(strip.length);
    return v;
  });
}
// Symbols visible on a reel for a stop index: [above, payline, below].
function slWindow(strip, stop) {
  const n = strip.length;
  return [strip[(stop - 1 + n) % n], strip[stop], strip[(stop + 1) % n]];
}
function slSymsAt(stops, strips) {
  const s = strips || SL_STRIPS;
  return stops.map((st, i) => s[i][st]);
}
// Highest bet in the list that `avail` chips can cover, never above `pref`.
// Returns the smallest bet when nothing is affordable (callers check affordability).
function slClampBet(pref, avail) {
  if (pref <= avail) return pref;
  for (let i = SL_BETS.length - 1; i >= 0; i--) if (SL_BETS[i] <= avail && SL_BETS[i] <= pref) return SL_BETS[i];
  return SL_BETS[0];
}
function slMaxBet(avail) {
  for (let i = SL_BETS.length - 1; i >= 0; i--) if (SL_BETS[i] <= avail) return SL_BETS[i];
  return SL_BETS[0];
}
// Distance (in cells) a reel travels from its previous stop to the new one.
function slTravel(prev, next, loops) {
  return SL_LEN * loops + (((next - prev) % SL_LEN) + SL_LEN) % SL_LEN;
}
function slFmt(n) {
  n = Math.round(n);
  const neg = n < 0;
  const s = String(Math.abs(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return (neg ? '-' : '') + s;
}
function slSigned(n) { return n > 0 ? '+' + slFmt(n) : n < 0 ? '−' + slFmt(-n) : '0'; }

// ---------------------------------------------------------------------------
// AUDIO — synthesized with Web Audio via Sound.ensureCtx(); honors Sound.enabled
// ---------------------------------------------------------------------------
const SlAudio = {
  on() { try { return !!(typeof Sound !== 'undefined' && Sound.enabled); } catch (e) { return false; } },
  ctx() { try { return typeof Sound !== 'undefined' && Sound.ensureCtx ? Sound.ensureCtx() : null; } catch (e) { return null; } },
  tone(freq, delay, dur, vol, type, slideTo) {
    if (!this.on()) return;
    const ctx = this.ctx();
    if (!ctx) return;
    try {
      const t0 = ctx.currentTime + delay;
      const osc = ctx.createOscillator();
      osc.type = type || 'triangle';
      osc.frequency.setValueAtTime(freq, t0);
      if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.linearRampToValueAtTime(vol, t0 + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0008, t0 + dur);
      osc.connect(g).connect(ctx.destination);
      osc.start(t0);
      osc.stop(t0 + dur + 0.03);
    } catch (e) { /* ignore */ }
  },
  noise(delay, dur, vol, freq, q, sweepTo) {
    if (!this.on()) return;
    const ctx = this.ctx();
    if (!ctx) return;
    try {
      const len = Math.max(1, Math.floor(ctx.sampleRate * dur));
      const buf = ctx.createBuffer(1, len, ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
      const src = ctx.createBufferSource();
      src.buffer = buf;
      const f = ctx.createBiquadFilter();
      f.type = 'bandpass';
      const t0 = ctx.currentTime + delay;
      f.frequency.setValueAtTime(freq, t0);
      if (sweepTo) f.frequency.exponentialRampToValueAtTime(sweepTo, t0 + dur);
      f.Q.value = q || 1;
      const g = ctx.createGain();
      g.gain.value = vol;
      src.connect(f).connect(g).connect(ctx.destination);
      src.start(t0);
    } catch (e) { /* ignore */ }
  },
  whoosh() { this.noise(0, 0.5, 0.12, 400, 0.8, 2400); },
  click() { this.noise(0, 0.045, 0.3, 1500, 1.4); this.tone(190, 0, 0.07, 0.12, 'square', 90); },
  // Rising coin jingle; the number of notes scales with the win size.
  jingle(mult) {
    const scale = [784, 988, 1175, 1319, 1568, 1760, 1976, 2349, 2637, 3136];
    const n = Math.max(3, Math.min(scale.length, 3 + Math.round(mult / 4)));
    for (let i = 0; i < n; i++) {
      this.tone(scale[i], i * 0.07, 0.22, 0.09, 'triangle');
      this.tone(scale[i] * 2, i * 0.07 + 0.015, 0.12, 0.04, 'sine');
    }
  },
  fanfare() {
    const seq = [[523, 0], [659, 0.14], [784, 0.28], [1047, 0.42], [784, 0.62], [1047, 0.76], [1319, 0.9]];
    seq.forEach(([f, t]) => { this.tone(f, t, 0.28, 0.1, 'square'); this.tone(f / 2, t, 0.28, 0.07, 'triangle'); });
    [523, 659, 784, 1047].forEach(f => this.tone(f, 1.1, 0.9, 0.07, 'triangle'));
    this.jingle(40);
  },
};

// ---------------------------------------------------------------------------
// MODULE STATE (state.sl is created lazily and survives leaving the screen)
// ---------------------------------------------------------------------------
function slLoadBet() {
  try {
    const v = parseInt(localStorage.getItem(SL_BET_KEY), 10);
    if (SL_BETS.indexOf(v) >= 0) return v;
  } catch (e) { /* ignore */ }
  return 10;
}
function slSaveBet(v) { try { localStorage.setItem(SL_BET_KEY, String(v)); } catch (e) { /* ignore */ } }

function slEnsureState() {
  if (!state.sl) {
    state.sl = {
      bet: slLoadBet(),           // preferred bet (display bet is clamped to what I can afford)
      stops: [slRandInt(SL_LEN), slRandInt(SL_LEN), slRandInt(SL_LEN)],
      spin: null,                 // the in-flight spin, or null
      seq: 0,
      lastResult: null,           // { syms, ev, bet, payout } of the last finished spin
      win: null,                  // { amount, mult, big, hits, at, dur } for the win presentation
      lastWin: 0, spins: 0, net: 0,
      auto: 0, autoTimer: null, autoNote: null,
      ptOpen: false, lastError: null, down: null, exp: null, raf: 0, keyBound: false,
    };
  }
  return state.sl;
}
function slReduced() {
  try { return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); } catch (e) { return false; }
}
function slOnScreen() { return state.screen === 'slots'; }
function slRender() { if (!slOnScreen()) return; try { render(); } catch (e) { console.error('slots render failed', e); } }

// Balance I can safely spend. state.chips lags a moment behind my own
// just-issued applyChipDelta, so remember the expected value for a few secs.
function slAvailable() {
  const sl = slEnsureState();
  let a = state.chips == null ? 0 : state.chips;
  if (sl.exp) {
    // The estimate only guards against a stale (too high) state.chips. As soon as
    // the balance moves off the value it had when the delta was issued, the
    // profile snapshot has arrived and the real number wins.
    if (state.chips !== sl.exp.from || Date.now() > sl.exp.until) sl.exp = null;
    else a = Math.min(a, sl.exp.value);
  }
  return a;
}
function slNoteDelta(delta) {
  const sl = slEnsureState();
  const base = slAvailable();
  sl.exp = { value: Math.max(0, base + delta), from: state.chips, until: Date.now() + 4000 };
}
function slEffBet() {
  const sl = slEnsureState();
  if (sl.spin) return sl.spin.bet;
  return slClampBet(sl.bet, slAvailable());
}

// ---------------------------------------------------------------------------
// ENTER / LEAVE
// ---------------------------------------------------------------------------
function slOnKey(e) {
  if (!slOnScreen()) return;
  if (e.key !== ' ' && e.key !== 'Enter' && e.code !== 'Space') return;
  const t = e.target;
  // Let focused buttons / inputs keep their native Space/Enter behavior.
  if (t && t.closest && t.closest('button, a, input, select, textarea, [contenteditable]')) return;
  e.preventDefault();
  if (e.repeat) return;
  slDispatch('spin');
}
function slBindKeys() {
  const sl = slEnsureState();
  if (sl.keyBound) return;
  document.addEventListener('keydown', slOnKey);
  sl.keyBound = true;
}
function slUnbindKeys() {
  const sl = state.sl;
  if (!sl || !sl.keyBound) return;
  document.removeEventListener('keydown', slOnKey);
  sl.keyBound = false;
}

function slPendingRead() { try { return JSON.parse(localStorage.getItem(SL_PENDING_KEY) || 'null'); } catch (e) { return null; } }
function slPendingWrite(spin) {
  if (!(spin.payout > 0)) return;
  try { localStorage.setItem(SL_PENDING_KEY, JSON.stringify({ id: spin.id, uid: state.user ? state.user.uid : null, payout: spin.payout, at: Date.now() })); } catch (e) { /* ignore */ }
}
function slPendingClear() { try { localStorage.removeItem(SL_PENDING_KEY); } catch (e) { /* ignore */ } }

// A tab closed mid-spin leaves a pending win behind. Pay it out once, but only
// if it is old enough that no live spin (<= ~3s) in another tab can own it.
function slRecoverPending() {
  const sl = slEnsureState();
  if (sl.spin) return;
  const p = slPendingRead();
  if (!p) return;
  const uid = state.user ? state.user.uid : null;
  if (!uid || p.uid !== uid || !(p.payout > 0) || !(Date.now() - p.at > 15000)) return;
  slPendingClear(); // clear BEFORE crediting so it can never pay twice
  slNoteDelta(p.payout);
  Promise.resolve(applyChipDelta(p.payout)).then(() => {
    sl.autoNote = 'Recovered ' + slFmt(p.payout) + ' chips from an interrupted spin.';
    slRender();
  }).catch(e => console.error('slots recovery failed', e));
}

function enterSlotsScreen() {
  const sl = slEnsureState();
  sl.lastError = null; sl.down = null; sl.auto = 0;
  if (sl.autoTimer) { clearTimeout(sl.autoTimer); sl.autoTimer = null; }
  slBindKeys();
  try { slRecoverPending(); } catch (e) { console.error(e); }
}
// Leaving never cancels an in-flight spin: its own promise chain still settles
// (credits the win) even though nothing is on screen any more.
function leaveSlotsScreen() {
  const sl = state.sl;
  if (!sl) return;
  slUnbindKeys();
  slUnbindRoot();
  sl.auto = 0; sl.down = null;
  if (sl.autoTimer) { clearTimeout(sl.autoTimer); sl.autoTimer = null; }
  if (sl.raf) { cancelAnimationFrame(sl.raf); sl.raf = 0; }
  sl.lastError = null;
}

// ---------------------------------------------------------------------------
// SPIN
// ---------------------------------------------------------------------------
function slSleep(ms) { return new Promise(r => setTimeout(r, Math.max(0, ms))); }

function slStartSpin(fromAuto) {
  const sl = slEnsureState();
  if (sl.spin) return false;                       // a spin is in flight (incl. its credit)
  if (state.chips == null) return false;
  const avail = slAvailable();
  if (avail < SL_BETS[0]) {
    sl.lastError = avail <= 0 ? 'You are out of chips. Tap Get More Chips to keep playing.' : 'Not enough chips to spin (minimum bet is ' + SL_BETS[0] + ').';
    sl.auto = 0;
    slRender();
    return false;
  }
  const bet = slClampBet(sl.bet, avail);
  if (bet > avail) { sl.lastError = 'Not enough chips for a ' + bet + ' bet.'; slRender(); return false; }
  if (fromAuto && sl.auto > 0) sl.auto--;

  const stops = slPickStops(slRng);
  const syms = slSymsAt(stops);
  const ev = slEvaluate(syms);
  const reduced = slReduced();
  const stopMs = (reduced ? SL_STOP_MS_REDUCED : SL_STOP_MS).slice();
  const prev = sl.stops.slice();
  const spin = {
    id: Date.now().toString(36) + '-' + (++sl.seq),
    bet, stops, syms, ev, mult: ev.mult, payout: bet * ev.mult,
    prevStops: prev, dist: stops.map((s, i) => slTravel(prev[i], s, SL_LOOPS[i])),
    t0: Date.now(), stopMs, reduced, settled: false,
  };
  sl.spin = spin;
  sl.lastError = null; sl.autoNote = null; sl.win = null;
  slNoteDelta(-bet);
  SlAudio.ctx();
  SlAudio.whoosh();

  const debit = Promise.resolve().then(() => applyChipDelta(-bet)).catch(e => console.error('slots debit failed', e));
  slRender();
  stopMs.forEach((ms, i) => setTimeout(() => { if (slOnScreen()) SlAudio.click(); }, ms));

  // The spin's own promise chain: debit -> wait for the reels -> settle. Not tied to rendering.
  spin.chain = (async () => {
    try {
      await debit;
      slPendingWrite(spin);
      await slSleep(spin.t0 + stopMs[2] + 40 - Date.now());
      await slSettle(spin);
    } catch (e) {
      console.error('slots spin failed', e);
    } finally {
      if (sl.spin === spin) { sl.spin = null; slRender(); }
    }
  })();
  return true;
}

async function slSettle(spin) {
  const sl = slEnsureState();
  if (spin.settled) return;                        // never credit twice
  spin.settled = true;
  slPendingClear();                                // clear BEFORE crediting
  sl.stops = spin.stops.slice();
  sl.spins++;
  sl.net += spin.payout - spin.bet;
  sl.lastResult = { syms: spin.syms, ev: spin.ev, bet: spin.bet, payout: spin.payout };
  if (spin.payout > 0) {
    const big = spin.mult >= SL_BIG_MULT;
    sl.lastWin = spin.payout;
    sl.win = { amount: spin.payout, mult: spin.mult, big, hits: spin.ev.hits, at: Date.now(), dur: Math.min(2400, 600 + spin.mult * 40) };
    if (slOnScreen()) {
      if (big) SlAudio.fanfare(); else SlAudio.jingle(spin.mult);
    }
  } else {
    sl.win = null;
  }
  slRender();
  if (sl.win) slStartCount();
  if (spin.payout > 0) {
    slNoteDelta(spin.payout);
    await Promise.resolve(applyChipDelta(spin.payout)).catch(e => console.error('slots credit failed', e));
  }
  if (sl.spin === spin) sl.spin = null;
  slRender();
  slAfterSettle(spin);
}

// Auto-spin continuation: stops on a big win, low chips, or when the count runs out.
function slAfterSettle(spin) {
  const sl = slEnsureState();
  if (sl.auto <= 0) return;
  if (!slOnScreen()) { sl.auto = 0; return; }
  if (spin.mult >= SL_BIG_MULT) { sl.auto = 0; sl.autoNote = 'Auto-spin stopped on a big win!'; slRender(); return; }
  if (slAvailable() < sl.bet) { sl.auto = 0; sl.autoNote = 'Auto-spin stopped: low chips.'; slRender(); return; }
  const wait = sl.win ? Math.max(700, sl.win.at + sl.win.dur + 500 - Date.now()) : 650;
  if (sl.autoTimer) clearTimeout(sl.autoTimer);
  sl.autoTimer = setTimeout(() => {
    sl.autoTimer = null;
    if (sl.auto > 0 && slOnScreen() && !sl.spin) {
      if (!slStartSpin(true)) sl.auto = 0;
    } else sl.auto = 0;
  }, wait);
}

function slToggleAuto() {
  const sl = slEnsureState();
  if (sl.auto > 0) {
    sl.auto = 0;
    if (sl.autoTimer) { clearTimeout(sl.autoTimer); sl.autoTimer = null; }
    slRender();
    return;
  }
  if (sl.spin) return;
  if (slAvailable() < sl.bet) { sl.lastError = 'Not enough chips for auto-spin at that bet.'; slRender(); return; }
  sl.auto = SL_AUTO_SPINS;
  if (!slStartSpin(true)) sl.auto = 0;
}

// Win count-up: one rAF loop that writes into whichever #sl-win-amt exists
// right now (render() may have replaced the node since the last frame).
function slWinShown(now) {
  const sl = state.sl;
  if (!sl || !sl.win) return 0;
  const p = Math.max(0, Math.min(1, (now - sl.win.at) / sl.win.dur));
  return Math.round(sl.win.amount * (1 - Math.pow(1 - p, 3)));
}
function slStartCount() {
  const sl = slEnsureState();
  if (sl.raf) cancelAnimationFrame(sl.raf);
  const step = () => {
    sl.raf = 0;
    if (!sl.win) return;
    const now = Date.now();
    const el = document.getElementById('sl-win-amt');
    if (el) el.textContent = slFmt(slWinShown(now));
    if (now < sl.win.at + sl.win.dur && slOnScreen()) sl.raf = requestAnimationFrame(step);
  };
  sl.raf = requestAnimationFrame(step);
}

// ---------------------------------------------------------------------------
// ART — one hidden SVG sprite (symbols + gradients), referenced with <use>
// ---------------------------------------------------------------------------
const SL_SPRITE = `
<svg class="sl-sprite" width="0" height="0" aria-hidden="true" focusable="false"><defs>
  <radialGradient id="sl-g-cherry" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#ff8b7d"/><stop offset=".45" stop-color="#d3202c"/><stop offset="1" stop-color="#70081a"/></radialGradient>
  <linearGradient id="sl-g-leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7fd05a"/><stop offset="1" stop-color="#2f7a2a"/></linearGradient>
  <linearGradient id="sl-g-lemon" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff7a0"/><stop offset=".55" stop-color="#f6cf14"/><stop offset="1" stop-color="#c79200"/></linearGradient>
  <radialGradient id="sl-g-plum" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#c996ff"/><stop offset=".5" stop-color="#7a35c4"/><stop offset="1" stop-color="#3c1470"/></radialGradient>
  <linearGradient id="sl-g-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3b4"/><stop offset=".5" stop-color="#f2b92c"/><stop offset="1" stop-color="#b87c0b"/></linearGradient>
  <linearGradient id="sl-g-badge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e5453d"/><stop offset="1" stop-color="#8b0f1c"/></linearGradient>
  <linearGradient id="sl-g-gem-a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d9fbff"/><stop offset="1" stop-color="#6fd6f2"/></linearGradient>

function slSym(name, cls) {
  return `<svg class="sl-cell${cls ? ' ' + cls : ''}" viewBox="-6 -6 112 112" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><use href="#sl-s-${name}"/></svg>`;
}
function slIcon(name) {
  return `<svg class="sl-ico" viewBox="0 0 100 100" aria-hidden="true"><use href="#sl-s-${name}"/></svg>`;
}

// ---------------------------------------------------------------------------
// RENDER
// ---------------------------------------------------------------------------
function slTopbar() {
  return `
    <div class="topbar sl-topbar">
      <button class="btn btn-ghost btn-sm" id="sl-done" data-sl-act="done">Done</button>
      <h1 class="page-title casino-title sl-title">Slots</h1>
      <div class="sl-top-right">
        <button class="sound-toggle" id="sl-sound-toggle" data-sl-act="sound" title="${Sound.enabled ? 'Mute sound' : 'Unmute sound'}">${Sound.enabled ? '🔊' : '🔇'}</button>
        <span class="chip-count sl-balance"><span class="chip-icon"></span><span id="sl-balance">${state.chips == null ? '…' : slFmt(state.chips)}</span></span>
      </div>
    </div>`;
}

function slReelHtml(i, now) {
  const sl = state.sl, sp = sl.spin, strip = SL_STRIPS[i];
  let style = '', cls = 'sl-strip', cells = '', fx = '';
  const rolling = sp && now < sp.t0 + sp.stopMs[i];
  if (rolling) {
    const m0 = SL_LEN + sp.prevStops[i], m1 = m0 + sp.dist[i];
    const elapsed = Math.max(0, now - sp.t0);
    for (let j = 0; j < SL_LEN * SL_REPS; j++) cells += slSym(strip[j % SL_LEN]);
    cls += ' sl-rolling';
    style = `--sl-from:${-(m0 - 1)};--sl-to:${-(m1 - 1)};--sl-dur:${sp.stopMs[i]}ms;--sl-dl:${-elapsed}ms;`;
    fx = `<div class="sl-fx" style="--sl-dur:${sp.stopMs[i]}ms;--sl-dl:${-elapsed}ms;"></div>`;
  } else {
    const stop = sp ? sp.stops[i] : sl.stops[i];
    const w = slWindow(strip, stop);
    const hit = !!(sl.win && !(sp && !sp.settled) && sl.win.hits[i]);
    cells = slSym(w[0]) + slSym(w[1], hit ? 'sl-hit' : '') + slSym(w[2]);
  }
  return `<div class="sl-reel" data-reel="${i}"><div class="${cls}" style="${style}">${cells}</div>${fx}</div>`;
}

function slResultMsg(sl) {
  if (sl.spin && !sl.spin.settled) return 'Spinning…';
  if (sl.autoNote) return escapeHtml(sl.autoNote);
  const r = sl.lastResult;
  if (!r) return 'Match three to win. Cherries pay too!';
  const ev = r.ev;
  if (ev.kind === 'three') return `${slLabel3(ev.symbol)} · ${ev.mult}×`;
  if (ev.kind === 'cherry2') return `Two cherries · ${ev.mult}×`;
  if (ev.kind === 'cherry1') return `One cherry · bet back`;
  return 'No win. Spin again!';
}
function slLabel3(sym) { return '3 ' + SL_PLURAL[sym]; }

function slPaytableHtml(bet) {
  const sl = state.sl;
  const winKey = sl.win && !sl.spin ? (sl.lastResult && sl.lastResult.ev.kind === 'three' ? 't' + sl.lastResult.ev.symbol : sl.lastResult && sl.lastResult.ev.kind) : null;
  const row = (key, icons, label, mult) => `
      <div class="sl-pt-row${winKey === key ? ' on' : ''}">
        <span class="sl-pt-ico">${icons}</span>
        <span class="sl-pt-lbl">${label}</span>
        <span class="sl-pt-mult">${mult}×</span>
        <span class="sl-pt-pay">${slFmt(mult * bet)}</span>
      </div>`;
  const order = ['seven', 'gem', 'bell', 'star', 'plum', 'lemon', 'cherry'];
  const rows = order.map(s => row('t' + s, slIcon(s) + slIcon(s) + slIcon(s), SL_PLURAL[s], SL_PAY3[s])).join('')
    + row('cherry2', slIcon('cherry') + slIcon('cherry') + '<span class="sl-any">any</span>', 'Two cherries', SL_PAY_CHERRY2)
    + row('cherry1', slIcon('cherry') + '<span class="sl-any">any</span><span class="sl-any">any</span>', 'One cherry', SL_PAY_CHERRY1);
  return `
    <div class="sl-pt${sl.ptOpen ? ' open' : ''}">
      <button class="sl-pt-head" id="sl-pt-toggle" data-sl-act="pt" aria-expanded="${sl.ptOpen}">
        <span>Paytable</span><span class="sl-pt-sub">pays on the middle line · bet ${bet}</span><span class="sl-pt-chev" aria-hidden="true"></span>
      </button>
      <div class="sl-pt-body">${rows}
        <div class="sl-pt-foot">Payouts are multiples of your bet. One payline: the highlighted middle row.</div>
      </div>
    </div>`;
}

function renderSlotsScreen() {
  const sl = slEnsureState();
  const now = Date.now();
  const spin = sl.spin;
  const rolling = !!(spin && !spin.settled);
  const avail = slAvailable();
  const bet = slEffBet();
  const chips = state.chips == null ? 0 : state.chips;
  const broke = state.chips != null && avail < SL_BETS[0] && !spin;
  const canSpin = !spin && state.chips != null && avail >= SL_BETS[0] && sl.auto <= 0;
  const lock = !!spin || sl.auto > 0;

  const win = sl.win && !rolling ? sl.win : null;
  const winAge = win ? Math.max(0, now - win.at) : 0;
  const life = win ? (win.big ? 3800 : 2400) : 0;
  const showFlash = !!(win && winAge < life);
  const wdl = `--sl-wdl:${-winAge}ms;--sl-life:${life}ms;`;

  const bulbs = Array.from({ length: 15 }, (_, k) => `<i class="sl-bulb" style="--k:${k % 3}"></i>`).join('');
  const reels = [0, 1, 2].map(i => slReelHtml(i, now)).join('');

  const flashHtml = showFlash ? `
        <div class="sl-flash${win.big ? ' big' : ''}" style="${wdl}">
          ${win.big ? '<div class="sl-rays"></div>' : ''}
          <div class="sl-flash-t">${win.big ? 'BIG WIN' : 'WIN'}</div>
          <div class="sl-flash-n">+<span id="sl-win-amt">${slFmt(slWinShown(now))}</span></div>
          <div class="sl-flash-x">${win.mult}× your bet</div>
        </div>` : '';

  const net = sl.net;
  const autoLbl = sl.auto > 0 ? `STOP<small>${sl.auto} left</small>` : `AUTO<small>×${SL_AUTO_SPINS}</small>`;
  const maxBet = slMaxBet(avail);

  return `
    ${SL_SPRITE}
    ${slTopbar()}
    <div class="content sl-content">
      ${sl.lastError ? `
        <div class="sl-error">
          <span>${escapeHtml(sl.lastError)}</span>
          <button class="btn btn-ghost btn-sm" id="sl-dismiss-error" data-sl-act="dismiss" style="flex-shrink:0;">Dismiss</button>
        </div>` : ''}
      <div class="sl-layout">
        <div class="sl-main">
          <div class="sl-machine${win ? ' sl-win' : ''}${showFlash ? ' sl-glow' : ''}${rolling ? ' sl-busy' : ''}" style="--sl-ph:${now % 1200};${wdl}">
            <div class="sl-marquee" aria-hidden="true">${bulbs}</div>
            <div class="sl-plaque"><span>Gilded Reels</span></div>
            <div class="sl-window">
              <div class="sl-reels">${reels}</div>
              <i class="sl-arrow l"></i><i class="sl-arrow r"></i><div class="sl-payline"></div>
              ${flashHtml}
            </div>
            <div class="sl-msg${win ? ' win' : ''}" id="sl-msg" aria-live="polite">${slResultMsg(sl)}</div>
            <div class="sl-leds">
              <div class="sl-led"><span>BET</span><b id="sl-led-bet">${slFmt(bet)}</b></div>
              <div class="sl-led"><span>LAST WIN</span><b id="sl-led-win">${slFmt(sl.lastWin)}</b></div>
              <div class="sl-led"><span>SPINS</span><b id="sl-led-spins">${slFmt(sl.spins)}</b></div>
              <div class="sl-led"><span>NET</span><b id="sl-led-net" class="${net > 0 ? 'up' : net < 0 ? 'down' : ''}">${slSigned(net)}</b></div>
            </div>
          </div>

          <div class="sl-bets" role="group" aria-label="Bet per spin">
            ${SL_BETS.map(v => `<button class="sl-betbtn b${v}${v === bet ? ' sel' : ''}" data-sl-act="bet" data-sl-key="${v}" ${lock || v > avail ? 'disabled' : ''} aria-pressed="${v === bet}" aria-label="Bet ${v}">${v}</button>`).join('')}
          </div>
          <div class="sl-ctl">
            <button class="btn btn-secondary sl-side" id="sl-max" data-sl-act="max" ${lock || broke || bet === maxBet ? 'disabled' : ''}>MAX BET<small>${maxBet}</small></button>
            <button class="sl-spin${rolling ? ' busy' : ''}" id="sl-spin" data-sl-act="spin" ${canSpin ? '' : 'disabled'} aria-label="Spin"><span>SPIN</span></button>
            <button class="btn btn-secondary sl-side${sl.auto > 0 ? ' on' : ''}" id="sl-auto" data-sl-act="auto" ${(spin && sl.auto <= 0) || broke ? 'disabled' : ''}>${autoLbl}</button>
          </div>
          ${broke ? `<button class="btn btn-primary btn-block" id="sl-get-chips" data-sl-act="getchips" style="margin-top:14px;">Get More Chips</button>` : ''}
          <div class="sl-hint">Space or Enter to spin${chips < SL_BETS[0] ? '' : ' · bets are clamped to what you can afford'}</div>
        </div>
        <div class="sl-side-col">${slPaytableHtml(bet)}</div>
      </div>
    </div>`;
}

// ---------------------------------------------------------------------------
// HANDLERS — delegated pointerdown/up on #root so a re-render between press
// and release (profile snapshots arrive constantly) cannot swallow a tap.
// ---------------------------------------------------------------------------
function slDispatch(act, key) {
  const sl = slEnsureState();
  try {
    switch (act) {
      case 'spin': if (!sl.spin && sl.auto <= 0) slStartSpin(false); break;
      case 'bet': {
        const v = parseInt(key, 10);
        if (sl.spin || sl.auto > 0 || SL_BETS.indexOf(v) < 0) break;
        if (v > slAvailable()) { sl.lastError = 'Not enough chips for a ' + v + ' bet.'; slRender(); break; }
        sl.bet = v; slSaveBet(v); Sound.chip(); slRender();
        break;
      }
      case 'max': {
        if (sl.spin || sl.auto > 0) break;
        sl.bet = slMaxBet(slAvailable()); slSaveBet(sl.bet); Sound.chip(); slRender();
        break;
      }
      case 'auto': slToggleAuto(); break;
      case 'pt': sl.ptOpen = !sl.ptOpen; slRender(); break;
      case 'dismiss': sl.lastError = null; slRender(); break;
      case 'sound': Sound.setEnabled(!Sound.enabled); slRender(); break;
      case 'getchips': Promise.resolve(resetChips()).catch(e => { sl.lastError = String(e && e.message || e); slRender(); }); break;
      case 'done': leaveSlotsScreen(); state.screen = 'home'; render(); break;
    }
  } catch (e) {
    console.error('slots handler failed', e);
    sl.lastError = (e && e.message) ? e.message : String(e);
    slRender();
  }
}

function slBindRoot() {
  const root = document.getElementById('root');
  if (!root || root._slb) return;
  const find = e => {
    const el = e.target && e.target.closest ? e.target.closest('[data-sl-act]') : null;
    return el && root.contains(el) ? el : null;
  };
  const idOf = el => el.dataset.slAct + ':' + (el.dataset.slKey || '');
  const onDown = e => {
    if (e.button > 0) return;
    const el = find(e);
    state.sl.down = el && !el.disabled ? { id: idOf(el), x: e.clientX, y: e.clientY } : null;
  };
  const onUp = e => {
    const d = state.sl && state.sl.down;
    if (state.sl) state.sl.down = null;
    if (!d) return;
    const el = find(e);
    if (!el || el.disabled || idOf(el) !== d.id) return;
    if (Math.hypot(e.clientX - d.x, e.clientY - d.y) > 14) return;
    slDispatch(el.dataset.slAct, el.dataset.slKey);
  };
  const onCancel = () => { if (state.sl) state.sl.down = null; };
  const onClick = e => { // keyboard / assistive activation only (detail 0)
    if (e.detail !== 0) return;
    const el = find(e);
    if (el && !el.disabled) slDispatch(el.dataset.slAct, el.dataset.slKey);
  };
  root.addEventListener('pointerdown', onDown);
  root.addEventListener('pointerup', onUp);
  root.addEventListener('pointercancel', onCancel);
  root.addEventListener('click', onClick);
  root._slb = { onDown, onUp, onCancel, onClick };
}
function slUnbindRoot() {
  const root = document.getElementById('root');
  if (!root || !root._slb) return;
  const b = root._slb;
  root.removeEventListener('pointerdown', b.onDown);
  root.removeEventListener('pointerup', b.onUp);
  root.removeEventListener('pointercancel', b.onCancel);
  root.removeEventListener('click', b.onClick);
  root._slb = null;
}
function attachSlotsHandlers() {
  slEnsureState();
  slBindRoot();
  slBindKeys();
}

if (typeof module !== 'undefined' && module.exports) {
  module.exports = {
    SL_LEN, SL_BETS, SL_SYMBOLS, SL_PAY3, SL_PAY_CHERRY2, SL_PAY_CHERRY1, SL_COUNTS, SL_STRIPS, SL_BIG_MULT, SL_STOP_MS,
    slBuildStrip, slEvaluate, slPayout, slComputeRtp, slHitRate, slRandInt, slPickStops, slWindow, slSymsAt,
    slClampBet, slMaxBet, slTravel, slFmt, slSigned, slSetRng,
  };
}
